<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тонус</title>
<meta name="theme-color" content="#0A7A73">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Тонус">
<meta name="author" content="Дмитрий и Екатерина Мёдовы, бизнес-партнёры NL">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<script>window.APP_MODE = 'release';</script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: phone-first single column, fixed bottom tab bar; cards only for the daily blocks */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --ink:#13211C; --muted:#5A6A64; --line:#DCE3DF;
  --accent:#0A7A73; --accent-ink:#FFFFFF; --accent-soft:#D5ECE9;
  --warm:#D9772B; --warm-soft:#FBE7D6; --water:#2B78CF; --water-soft:#DCE9F8;
  --good:#23824F; --bad:#C0392F;
  --shadow:0 1px 2px rgba(19,33,28,.06),0 6px 18px rgba(19,33,28,.06);
  --f-display:'Unbounded','Onest',system-ui,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1614; --surface:#18221F; --ink:#E6EEEA; --muted:#94A39D; --line:#2A3632;
    --accent:#3DBDB2; --accent-ink:#06221F; --accent-soft:#163A36;
    --warm:#F0A060; --warm-soft:#3A2717; --water:#6AA6EE; --water-soft:#17283D;
    --good:#5CC48A; --bad:#EF7A70; --shadow:0 0 0 1px #24302C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#18221F; --ink:#E6EEEA; --muted:#94A39D; --line:#2A3632;
  --accent:#3DBDB2; --accent-ink:#06221F; --accent-soft:#163A36;
  --warm:#F0A060; --warm-soft:#3A2717; --water:#6AA6EE; --water-soft:#17283D;
  --good:#5CC48A; --bad:#EF7A70; --shadow:0 0 0 1px #24302C;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}

.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(100px + env(safe-area-inset-bottom,0px))}
.view{display:grid;gap:14px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:4px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--f-display);font-weight:600;font-size:25px;line-height:1.18;margin:4px 0 0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:17px;font-weight:700;margin:0;line-height:1.3}
h3{font-size:14px;font-weight:700;margin:14px 0 4px}
p{margin:0}
.small{font-size:13px}
.muted{color:var(--muted)}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-weight:500}
.tnum{font-variant-numeric:tabular-nums}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:8px}

.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:grid;gap:12px;min-width:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.btn{appearance:none;border:0;border-radius:12px;padding:11px 16px;font-weight:600;font-size:15px;cursor:pointer;background:var(--accent);color:var(--accent-ink);min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px}
.btn.wide{width:100%}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.x{appearance:none;border:0;background:transparent;width:36px;height:36px;border-radius:10px;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;flex:none}
.x:hover{background:var(--bg)}

input,select{font:inherit;font-size:16px;padding:9px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px;width:100%;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}

/* demo banner */
.demo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;border:1.5px dashed var(--accent);background:var(--accent-soft);font-size:14px}
.demo div{flex:1 1 200px;min-width:0}

/* calories */
.kcal{grid-template-columns:120px 1fr;align-items:center;gap:16px}
.kcal .btn{grid-column:1/-1}
.ring{width:120px;height:120px;display:block}
.ring-bg{fill:none;stroke:var(--warm-soft);stroke-width:11}
.ring-fg{fill:none;stroke:var(--warm);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring-fg.over{stroke:var(--bad)}
.ring-num{font-family:var(--f-display);font-size:23px;font-weight:600;fill:var(--ink);text-anchor:middle}
.ring-sub{font-size:10px;fill:var(--muted);text-anchor:middle}
.kcal-side{display:grid;gap:8px;min-width:0}
.big{font-size:26px;line-height:1.1}
.big small{font-family:var(--f-body);font-size:14px;color:var(--muted);font-weight:500}
.mb{display:grid;gap:3px}
.mb-top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);gap:6px}
.mb-track{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.mb-track i{display:block;height:100%;background:var(--accent);border-radius:4px}

/* program checklist */
.checks{display:grid;gap:6px}
.check{appearance:none;border:0;background:var(--bg);border-radius:12px;padding:11px 12px;display:flex;align-items:flex-start;gap:12px;text-align:left;cursor:pointer;min-height:44px;width:100%}
.check .box{flex:none;width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;margin-top:1px}
.check.on .box{background:var(--accent);box-shadow:none}
.check.on .box::after{content:"";width:10px;height:6px;border:2.5px solid var(--accent-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.check.on .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.check .when{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.progbar{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.progbar i{display:block;height:100%;background:var(--accent)}

/* water */
.glasses{display:flex;flex-wrap:wrap;gap:7px}
.glass{appearance:none;border:0;width:28px;height:38px;border-radius:5px 5px 10px 10px;background:var(--water-soft);cursor:pointer;position:relative;padding:0}
.glass.on{background:var(--water)}
.water-v{color:var(--water);font-weight:700}

/* mini stat cards */
.mini{appearance:none;border:0;text-align:left;cursor:pointer;background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);display:grid;gap:4px;align-content:start;min-width:0}
.mini .num{font-size:21px}
.mini .num small{font-family:var(--f-body);font-size:13px;color:var(--muted)}
.good{color:var(--good)} .bad{color:var(--bad)}

/* mood & sleep */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood{appearance:none;border:0;background:var(--bg);border-radius:12px;padding:8px 2px;display:grid;gap:2px;justify-items:center;cursor:pointer;min-height:56px}
.mood .num{font-size:18px}
.mood small{font-size:10.5px;color:var(--muted);line-height:1.15;text-align:center}
.mood.on{background:var(--accent);color:var(--accent-ink)}
.mood.on small{color:var(--accent-ink)}
.stepper{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:12px;padding:3px}
.stepper button{appearance:none;border:0;background:var(--surface);width:38px;height:38px;border-radius:10px;font-size:20px;cursor:pointer;box-shadow:var(--shadow)}
.stepper b{min-width:62px;text-align:center}

/* food diary */
.daynav{display:flex;align-items:center;gap:4px}
.daynav button{appearance:none;border:0;background:var(--surface);box-shadow:var(--shadow);width:40px;height:40px;border-radius:12px;font-size:20px;cursor:pointer}
.daynav button:disabled{opacity:.35;cursor:default}
.tot{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:8px}
.tot div{display:grid;gap:2px;min-width:0}
.tot .num{font-size:18px}
.tot span{font-size:12px;color:var(--muted)}
.meal{display:grid;gap:8px}
.entries{list-style:none;margin:0;padding:0;display:grid}
.entry{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.e-main{flex:1;min-width:0}
.e-name{font-weight:600;overflow-wrap:anywhere}
.e-kcal{font-size:15px;white-space:nowrap}
.empty{font-size:14px;color:var(--muted);padding:2px 0}

/* products */
.tile{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:15px;background:var(--warm-soft);color:var(--warm)}
.tile.sup{background:var(--accent-soft);color:var(--accent)}
.tile.oth{background:var(--bg);color:var(--muted)}
.tile.big{width:58px;height:58px;font-size:18px;border-radius:16px}
.plist{display:grid;gap:8px}
.prow{appearance:none;border:0;width:100%;text-align:left;cursor:pointer;background:var(--surface);border-radius:16px;padding:12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.prow .pm{flex:1;min-width:0}
.pn{font-weight:600;overflow-wrap:anywhere}
.prow.dim{opacity:.72}
.nlrow{padding:6px 0}
.pre{white-space:pre-line}
.infobox{display:grid;gap:8px;justify-items:start;background:var(--bg);border-radius:14px;padding:12px 14px}
details summary{cursor:pointer;font-weight:700;font-size:14px;margin-top:14px}
details p{margin-top:6px}
.prow .pk{font-size:14px;white-space:nowrap;color:var(--muted)}
.kbju{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kbju div{background:var(--bg);border-radius:12px;padding:10px 8px;display:grid;gap:2px;text-align:center}
.kbju .num{font-size:17px}
.kbju span{font-size:11.5px;color:var(--muted)}
.prog{display:grid;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);width:fit-content}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .lbl{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .end{fill:var(--accent)}
.chart .endl{fill:var(--ink);font-size:12px;font-weight:700;font-family:var(--f-body)}
.chart .tg{stroke:var(--good);stroke-width:1.5;stroke-dasharray:5 4}
.chart .tgl{fill:var(--good);font-size:11px;font-weight:600}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{appearance:none;border:0;background:transparent;border-radius:9px;padding:7px 10px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;flex:1;min-height:36px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);display:grid;gap:2px;min-width:0}
.stat .num{font-size:20px}
.stat .num small{font-family:var(--f-body);font-size:13px;color:var(--muted)}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.hist .hd{flex:1;min-width:0}

/* bluetooth */
.bt-live{display:flex;align-items:center;gap:14px}
.heart{width:44px;height:44px;flex:none;color:var(--bad)}
.heart.beat{animation:beat 1s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(1)}}
.bt-bpm{font-size:40px;line-height:1}

/* consultant */
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.how ol{margin:6px 0 0;padding-left:20px;display:grid;gap:4px;font-size:14px}
.norm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.norm div{background:var(--bg);border-radius:12px;padding:10px;display:grid;gap:2px}
.norm .num{font-size:18px}
.norm span{font-size:12px;color:var(--muted)}
.fine{font-size:12.5px;color:var(--muted);line-height:1.5}

/* assistant chat */
.chat-wrap{position:fixed;inset:0;z-index:35;background:var(--bg);display:flex;flex-direction:column}
.chat-head{display:flex;align-items:center;gap:12px;background:var(--surface);border-bottom:1px solid var(--line);padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.chat-head > div:not(.chat-av){flex:1;min-width:0}
.chat-av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:600}
.chat-log{flex:1;overflow-y:auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.chat-in-log{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.msg{max-width:84%;padding:10px 14px;border-radius:18px;line-height:1.42;font-size:15.5px;white-space:pre-line;overflow-wrap:anywhere;animation:pop .18s ease-out}
.msg.bot{background:var(--surface);border-bottom-left-radius:6px;align-self:flex-start;box-shadow:var(--shadow)}
.msg.me{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px;align-self:flex-end}
.msg a{color:var(--accent);font-weight:700}
.msg.typing{color:var(--muted);letter-spacing:.2em}
@keyframes pop{from{transform:translateY(6px)}}
.chat-foot{background:var(--surface);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.chat-foot-in{max-width:560px;margin:0 auto;display:grid;gap:8px}
.replies{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.replies.col{flex-direction:column;align-items:stretch;max-height:46vh;overflow-y:auto}
.reply{appearance:none;border:0;border-radius:16px;padding:10px 16px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:15px;cursor:pointer;min-height:44px;text-align:left}
.replies:not(.col) .reply{border-radius:999px}
.chat-form{display:flex;gap:8px;align-items:center}
.chat-form input{flex:1}
.chat-form .unit{color:var(--muted);font-weight:600}
.chat-hint{font-size:13px;color:var(--bad);text-align:right}
.chat-hint:empty{display:none}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{appearance:none;border:0;background:transparent;display:grid;justify-items:center;gap:3px;padding:9px 2px 8px;cursor:pointer;color:var(--muted);font-size:11px;font-weight:600;min-height:56px}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet-back{position:absolute;inset:0;background:rgba(8,14,12,.45)}
.sheet{position:relative;width:100%;max-width:560px;max-height:88vh;max-height:88dvh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:8px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.sheet-grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 2px}
.sheet-head{display:flex;align-items:center;gap:12px}
.sheet-head > div{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:0;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;background:var(--bg);color:var(--muted);cursor:pointer;min-height:36px;flex:none;white-space:nowrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.prodpage .chip{background:var(--surface);box-shadow:var(--shadow)}
.prodpage .chip.on{background:var(--ink);color:var(--surface)}
.chip.on{background:var(--ink);color:var(--surface)}
.pick{display:grid;gap:10px;background:var(--accent-soft);border-radius:14px;padding:12px}
.pick .row input{width:96px;flex:none}
.flist{display:grid}
.frow{appearance:none;border:0;background:transparent;text-align:left;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:11px 4px;border-top:1px solid var(--line);width:100%}
.frow:first-child{border-top:0}
.frow span:last-child{color:var(--muted);white-space:nowrap;font-size:14px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--surface);border-radius:14px;padding:11px 14px;font-size:14px;display:flex;gap:14px;align-items:center;width:max-content;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast button{appearance:none;border:0;background:transparent;color:var(--surface);font-weight:700;text-decoration:underline;cursor:pointer;padding:4px}

/* daily notes, menu, activity */
.notes{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.notes li{display:grid;grid-template-columns:8px 1fr;gap:10px;align-items:start;font-size:15px}
.notes li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:7px}
.notes .btn{justify-self:start;margin-top:6px}
.tip{background:var(--accent-soft);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.back{border:2px solid var(--accent)}
.back p{margin:0}
.tip > b{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.mlist{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:14px}

const pad = n => String(n).padStart(2,'0');
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const todayKey = () => dkey(new Date());
const daysBetween = (a,b) => Math.round((parseKey(b) - parseKey(a)) / 864e5);
const fmtDay = k => parseKey(k).toLocaleDateString('ru-RU', { day:'numeric', month:'long' });
const fmtShort = k => parseKey(k).toLocaleDateString('ru-RU', { day:'numeric', month:'short' }).replace('.', '');
const fmtN = (n,d=1) => Number(n).toLocaleString('ru-RU', { maximumFractionDigits:d }).replace('-', '−');
const r1 = n => Math.round(n*10)/10;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

/* Что понадобится на программу: каждый пункт плана — 1 порция в день;
   упаковки считаем, если на сайте NL указано число порций в упаковке */
function programBasket(pr){
  const by = new Map();
  for (const i of pr.plan){
    const p = prod(i.product); if (!p) continue;
    by.set(p.id, { p, n: Math.max((by.get(p.id) || {}).n || 0, i.to || pr.days) });
  }
  return [...by.values()].map(({ p, n }) => {
    const inPack = parseInt(p.pack, 10);
    return { p, need: inPack > 0 ? `${Math.ceil(n/inPack)} уп. (нужно ${n} ${plural(n, 'порция', 'порции', 'порций')}, в упаковке ${p.pack})`
                                  : `на ${nDays(n)} — количество по инструкции на упаковке` };
  });
}

const relDay = k => { const n = daysBetween(k, todayKey()); return n === 0 ? 'Сегодня' : n === 1 ? 'Вчера' : fmtDay(k); };
const plural = (n, one, few, many) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? many : b === 1 ? one : b >= 2 && b <= 4 ? few : many; };
const nDays = n => n + ' ' + plural(n, 'день', 'дня', 'дней');

function sortedWeights(){ return S.weights.slice().sort((a,b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0); }
function currentWeight(){ const w = sortedWeights(); return w.length ? w[w.length-1].kg : (S.profile.startWeight || 70); }
function bmrOf(w){ const pr = S.profile; return 10*w + 6.25*pr.height - 5*pr.age + (pr.sex === 'm' ? 5 : -161); }
function goals(){
  const pr = S.profile, w = currentWeight();
  const bmr = bmrOf(w);
  const k = { lose:0.85, keep:1, gain:1.1 }[pr.goal] || 1;
  const kcal = Math.max(1200, Math.round(bmr*pr.activity*k/10)*10);
  const p = Math.round(w*1.4), f = Math.round(kcal*0.3/9);
  const c = Math.max(0, Math.round((kcal - p*4 - f*9)/4));
  const water = Math.round(w*30/50)*50;
  return { kcal, p, f, c, water };
}

/* Прогноз до цели: 1 кг жира ≈ 7700 ккал. Расчётный темп — по разнице между расходом и нормой,
   фактический — по замерам за последние 8 недель, если они охватывают хотя бы 2 недели */
function forecast(){
  const pr = S.profile, cur = currentWeight();
  if (!pr.target || pr.goal === 'keep') return null;
  const dir = pr.goal === 'lose' ? -1 : 1, left = r1((pr.target - cur)*dir);
  if (left <= 0) return { done:true };
  const delta = Math.abs(bmrOf(cur)*pr.activity - goals().kcal);
  const weekly = Math.min(1, delta*7/7700);
  const res = { left, delta:Math.round(delta/10)*10, weekly, weeks: weekly >= 0.05 ? left/weekly : null };
  const from = dkey(addDays(new Date(), -56)), ws = sortedWeights().filter(w => w.d >= from);
  const span = ws.length >= 3 ? daysBetween(ws[0].d, ws[ws.length-1].d) : 0;
  if (span >= 14){
    res.pace = Math.round((ws[ws.length-1].kg - ws[0].kg)/span*7*100)/100;
    if (res.pace*dir >= 0.05) res.paceWeeks = left/(res.pace*dir);
  }
  return res;
}
/* «примерно 4–6 месяцев»: диапазон, а не точная дата — вес уходит неравномерно */
function fmtSpan(weeks){
  if (weeks < 8){
    const a = Math.max(1, Math.floor(weeks*0.85)), b = Math.max(a + 1, Math.ceil(weeks*1.15));
    return `${a}–${b} ${plural(b, 'неделя', 'недели', 'недель')}`;
  }
  const m = weeks/4.35, a = Math.max(1, Math.floor(m*0.85)), b = Math.max(a + 1, Math.ceil(m*1.15));
  return `${a}–${b} ${plural(b, 'месяц', 'месяца', 'месяцев')}`;
}
const fmtMonth = weeks => addDays(new Date(), Math.round(weeks*7)).toLocaleDateString('ru-RU', { month:'long', year:'numeric' });
function fmtDur(n){
  if (n < 14) return nDays(n);
  if (n < 61){ const w = Math.round(n/7); return w + ' ' + plural(w, 'неделю', 'недели', 'недель'); }
  const m = Math.round(n/30.4); return m + ' ' + plural(m, 'месяц', 'месяца', 'месяцев');
}
/* изменение замера (вес, талия, бёдра) от первой записи до последней */
function change(field){
  const ws = sortedWeights().filter(w => w[field] != null);
  if (ws.length < 2) return null;
  const a = ws[0], b = ws[ws.length-1];
  return { from:a[field], to:b[field], diff:r1(b[field] - a[field]), dur:daysBetween(a.d, b.d), since:a.d };
}
const signed = v => (v > 0 ? '+' : '') + fmtN(v);

/* Цикл: храним только даты начала месячных. Средняя длина — по последним 3 циклам длиной 21–45 дней, иначе 28.
   Овуляцию не считаем: это не метод контрацепции и не медицинский прогноз */
const cycleOn = () => S.profile.sex === 'f' && S.profile.cycle !== false;
function cycleInfo(t){
  const ps = S.periods.filter(d => d <= t).sort();
  if (!ps.length) return null;
  const last = ps[ps.length-1], lens = [];
  for (let i = 1; i < ps.length; i++){ const n = daysBetween(ps[i-1], ps[i]); if (n >= 21 && n <= 45) lens.push(n); }
  const recent = lens.slice(-3), avg = recent.length ? Math.round(recent.reduce((a,b) => a + b, 0)/recent.length) : 28;
  return { last, day: daysBetween(last, t) + 1, avg, next: dkey(addDays(parseKey(last), avg)), measured: recent.length > 0 };
}
/* перед месячными и в первые дни вес часто прибавляет из-за воды */
function cycleWaterDays(t){
  if (!cycleOn()) return null;
  const ci = cycleInfo(t); if (!ci) return null;
  const toNext = daysBetween(t, ci.next);
  return ci.day <= 4 || (toNext >= 0 && toNext <= 5) ? ci : null;
}

/* Поиск понимает русское и английское написание: «дрейн эффект», «драй», «DrainEffect»; «эд смарт», «энерджи диет», «гринфлеш».
   Каждое слово запроса ищем в трёх видах: как есть (без пробелов, ё = е), латиницей и «скелетом» из согласных
   (drain и дрейн → drn, collagen и коллаген → klgn) — скелет должен совпасть с началом слова в названии */
const TR = { а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'j',з:'z',и:'i',й:'i',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',
  х:'h',ц:'ts',ч:'ch',ш:'sh',щ:'sh',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya' };
const compact = s => s.toLowerCase().replace(/ё/g, 'е').replace(/[^\p{L}\p{N}]+/gu, '');
const translit = s => [...compact(s)].map(ch => TR[ch] ?? ch).join('');
function skel(w){   // первая гласная остаётся меткой «a»: omega → amg, а не mg, как у magnesium
  const t = translit(w).replace(/dj/g, 'j').replace(/g(?=[eiy])/g, 'j').replace(/c(?=[eiy])/g, 's').replace(/ph/g, 'f')
    .replace(/[cq]/g, 'k').replace(/w/g, 'v').replace(/x/g, 'ks');
  return (/^[aeiouy]/.test(t) ? 'a' : '') + t.replace(/[aeiouy]/g, '').replace(/(.)\1+/g, '$1');
}
const words = s => s.replace(/(\p{Ll})(\p{Lu})/gu, '$1 $2').split(/[^\p{L}\p{N}]+/u).filter(Boolean);   // «ДрейнЭффект» → «Дрейн», «Эффект»
const searchKeys = new Map();
function searchKey(text){
  if (!searchKeys.has(text)) searchKeys.set(text, { c: compact(text), t: translit(text), w: words(text).map(skel) });
  return searchKeys.get(text);
}
/* 2 — совпало написание (или основа: «мята» → «мяты», «фисташка» → «фисташковый»), 1 — только по звучанию, 0 — не подходит */
function searchScore(text, q){
  const k = searchKey(text);
  let score = 2;
  for (const w of words(q)){
    const c = compact(w), stem = c.length >= 4 && /[аяыиеоуюйь]$/.test(c) ? c.slice(0, -1) : c;
    if (k.c.includes(stem) || k.t.includes(translit(w))) continue;
    const s = skel(w);   // по звучанию: 2 согласных хватает только коротким словам («драй», «коффе»), иначе слишком много лишнего
    if ((s.length >= 3 || (s.length === 2 && c.length <= 5)) && k.w.some(x => x.startsWith(s))){ score = 1; continue; }
    return 0;
  }
  return score;
}
/* показываем только лучшие совпадения: есть точные — похожие по звучанию не мешают */
function textFilter(list, q, text){
  if (!(q || '').trim()) return list;
  const scored = list.map(x => [x, searchScore(text(x), q)]), best = Math.max(0, ...scored.map(([, s]) => s));
  const phrase = compact(q), whole = x => searchKey(text(x)).c.includes(phrase) ? 0 : 1;   // вся фраза целиком («витамин с») — первой
  return best ? scored.filter(([, s]) => s === best).map(([x]) => x).sort((a,b) => whole(a) - whole(b)) : [];
}
function prodFilter(list, q, cat){
  return textFilter(list.filter(p => !cat || p.cats.includes(cat)), q, p => p.name + ' ' + (p.brand || ''));
}
function kcalLabel(p){ return p.kcal != null ? fmtN(p.kcal,0) + ' ккал ' + p.basis : p.kind === 'supplement' ? 'БАД' : p.kind === 'other' ? '' : 'калорийность не указана'; }
function catChips(act, cur){
  return `<div class="chips scroll">${[['','Все'], ...CATS.map(c => [c,c])].map(([v,l]) => `<button class="chip ${v === (cur || '') ? 'on' : ''}" data-act="${act}" data-c="${esc(v)}">${l}</button>`).join('')}</div>`;
}
function fmtTime(ts){
  const d = new Date(ts), k = dkey(d);
  return relDay(k).replace('Сегодня','сегодня').replace('Вчера','вчера') + ', ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

/* «С возвращением»: человек не открывал приложение 2 дня и больше — дружелюбная карточка без упрёков, как в Duolingo.
   День последнего входа хранится в S.lastSeen; у тех, кто обновился со старой версии, его ещё нет — берём день последней записи */
function lastActivity(){
  const keys = [S.meals, S.water, S.checks, S.mood, S.sleep, S.steps].flatMap(o => Object.keys(o || {}));
  S.weights.forEach(w => keys.push(w.d));
  return keys.length ? keys.reduce((a,b) => a > b ? a : b) : null;
}
function noteVisit(){
  const t = todayKey();
  if (S.lastSeen === t) return false;
  const last = S.lastSeen || lastActivity(), missed = last ? daysBetween(last, t) - 1 : 0;
  if (missed >= 2 && !S.demo && (S.profile.name || S.weights.length)) S.back = { d:t, missed };
  S.lastSeen = t; save();
  return true;
}
/* самая длинная серия дней подряд с записями в дневнике питания */
function bestStreak(){
  let best = 0, run = 0, prev = null;
  for (const k of Object.keys(S.meals).filter(k => S.meals[k].length).sort()){
    run = prev && daysBetween(prev, k) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = k;
  }
  return best;
}
function backCard(t){
  const b = S.back;
  if (!b || b.d !== t || S.profile.hints === false) return '';
  const n = b.missed, lines = [];
  lines.push(n <= 3 ? `Ничего страшного — главное, что ты ${sx('вернулся','вернулась')}. Давай продолжим!`
    : n <= 13 ? 'Так бывает у всех. Навёрстывать не нужно — просто продолжим с сегодняшнего дня.'
    : 'Давно не виделись! Самое время начать заново — с чистого листа и без упрёков.');
  if (S.program){
    const p = progById(S.program.id), day = daysBetween(S.program.start, t) + 1;
    if (p && day >= 1 && day <= p.days) lines.push(`Программа «${p.name}» продолжается: сегодня ${day}-й день из ${p.days}.`);
  }
  const best = bestStreak();
  lines.push(best >= 3 ? `Твой рекорд — ${nDays(best)} дневника подряд. Начни новую серию сегодня и попробуй его побить!`
    : 'Запиши сегодня хотя бы один приём пищи — и начнётся новая серия дней подряд.');
  return `<div class="card back">
    <div class="row between"><div><div class="eyebrow">Ты ${sx('пропустил','пропустила')} ${nDays(n)}</div>
      <h2>С возвращением${S.profile.name ? ', ' + esc(S.profile.name) : ''}!</h2></div>
      <button class="x" data-act="back-hide" aria-label="Закрыть">×</button></div>
    ${lines.map(l => `<p class="small">${esc(l)}</p>`).join('')}
    <div class="row wrap">
      <button class="btn sm" data-act="add-food" data-meal="${mealByTime()}">Добавить еду</button>
      <button class="btn sm ghost" data-act="water-add" data-ml="250">+ стакан воды</button>
      ${n >= 7 ? `<button class="btn sm line" data-act="tab" data-v="progress" data-to="w-form">Записать вес</button>` : ''}
    </div>
  </div>`;
}

/* «На сегодня»: что не забыть + совет дня. Скрывается до завтра крестиком или совсем — в профиле */
const DUE_FROM = { 'Утро':6, 'Днём':12, 'Обед':12, 'Перекус':15, 'Ужин':18 };
function notesCard(t){
  const pr = S.profile;
  if (pr.hints === false || S.notesHidden === t || (!pr.name && !S.weights.length)) return '';
  const h = new Date().getHours(), g = goals(), meals = S.meals[t] || [], notes = [];
  if (S.program){
    const p = progById(S.program.id), day = daysBetween(S.program.start, t) + 1;
    if (p && day >= 1 && day <= p.days){
      notes.push(day === p.days ? `Сегодня последний, ${day}-й день программы «${p.name}» — ты почти у цели!` : `Сегодня ${day}-й день программы «${p.name}».`);
      const ch = S.checks[t] || {}, due = p.plan.filter(i => (!i.to || day <= i.to) && !ch[i.id] && h >= (DUE_FROM[i.when] ?? 6));
      if (due.length) notes.push('Ещё не отмечено: ' + due.map(i => i.text).join('; ') + '.');
    }
  }
  const sd = suppsDue(t, h);
  if (sd.length) notes.push('Мои добавки — пора принять: ' + sd.map(s => s.name + (s.note ? ` (${s.note})` : '')).join('; ') + '.');
  if (h >= 11 && !meals.some(e => e.meal === 'breakfast')) notes.push(`Ты ещё не ${sx('записал','записала')} завтрак. Если уже ${sx('поел','поела')} — добавь, пока помнишь.`);
  const streak = diaryStreak();
  if (streak >= 2) notes.push(meals.length ? `Ты ведёшь дневник ${streak}-й день подряд — ${sx('молодец','умница')}!` : `Вчера был ${streak}-й день дневника подряд. Продолжим сегодня?`);
  const every = pr.weighEvery ?? 7, ws = sortedWeights(), last = ws.length ? ws[ws.length-1].d : null;
  const weighDue = every > 0 && (!last || daysBetween(last, t) >= every);
  if (weighDue) notes.push(last ? `Пора взвеситься: последний замер ${nDays(daysBetween(last, t))} назад.` : 'Запиши свой вес — с него начнётся график.');
  const water = S.water[t] || 0;
  if (h >= 16 && water < g.water/2) notes.push(`Выпито ${fmtN(water/1000,1)} л воды из ${fmtN(g.water/1000,1)} — самое время для стакана.`);
  return `<div class="card">
    <div class="row between"><h2>На сегодня</h2><button class="x" data-act="notes-hide" aria-label="Скрыть до завтра">×</button></div>
    ${notes.length ? `<ul class="notes">${notes.map(n => `<li><span>${esc(n)}</span></li>`).join('')}</ul>` : ''}
    ${weighDue ? `<button class="btn line sm" style="justify-self:start" data-act="tab" data-v="progress" data-to="w-form">Записать вес</button>` : ''}
    ${tipHTML(t)}
  </div>`;
}
/* совет дня; к советам о сне, тревоге и 45+ — ссылка на рубрику сайта NL (не чаще, чем через день) */
function tipHTML(t){
  const [tag, text] = tipOfDay(t), rub = TIP_RUBRIC[tag];
  return `<div class="tip"><b>Совет дня</b><p class="small">${esc(text)}</p>
    ${rub ? `<button class="btn line sm" style="justify-self:start" data-act="goal-open" data-g="${esc(rub)}">Продукты NL: рубрика «${esc(rub)}»</button>` : ''}</div>`;
}
/* через день — совет по тому, что человек отметил в анкете (сон, энергия, тревога, 45+), в остальные дни — общий */
function tipOfDay(t){
  const pr = S.profile, n = Math.abs(daysBetween('2026-01-01', t));
  const mine = [pr.concern, pr.sex === 'f' && pr.age >= 45 ? '45' : null].filter(x => x && x !== 'ok');
  const pool = TIPS.filter(([tag]) => n % 2 === 0 && mine.length ? mine.includes(tag) : ['food','water','move','weight'].includes(tag));
  return pool[Math.floor(n/2) % pool.length];
}

/* --- меню и рецепты --- */
const ing = ([a, b]) => a === 'nl' ? { nl:prod(b) } : { f:food(a), g:b };
const ingKcal = x => x.nl ? (x.nl.kcal || 0) : x.f.kcal*x.g/100;
/* день меню с порциями под норму: обычная еда масштабируется, продукты NL — 1 порция */
function menuPlan(i){
  const day = MENU_DAYS[i], norm = goals().kcal;
  const all = MEALS.flatMap(([m]) => (day.meals[m] || []).map(ing)).filter(x => x.nl || x.f);
  const nl = all.filter(x => x.nl).reduce((a,x) => a + ingKcal(x), 0), base = all.reduce((a,x) => a + ingKcal(x), 0);
  const k = Math.min(1.6, Math.max(0.7, (norm - nl)/(base - nl)));
  const meals = {};
  for (const [m] of MEALS){
    meals[m] = (day.meals[m] || []).map(ing).filter(x => x.nl || x.f).map(x => {
      if (x.nl) return { nl:x.nl, name:x.nl.name, amount:'1 порция', kcal:Math.round(x.nl.kcal || 0) };
      const g = Math.max(10, Math.round(x.g*k/10)*10);
      return { f:x.f, g, name:x.f.name, amount:fmtN(g,0) + ' ' + x.f.unit, kcal:Math.round(x.f.kcal*g/100) };
    });
  }
  const total = Object.values(meals).flat().reduce((a,x) => a + x.kcal, 0);
  return { meals, total };
}
function recipeTotals(r){
  return r.ing.map(ing).filter(x => x.f).reduce((a,x) => { const k = x.g/100;
    return { kcal:a.kcal + x.f.kcal*k, p:a.p + x.f.p*k, f:a.f + x.f.f*k, c:a.c + x.f.c*k }; }, { kcal:0, p:0, f:0, c:0 });
}

/* «Путь к цели»: что уже получилось — словами, и примерный срок до цели */
function pathCard(){
  const pr = S.profile, w = change('kg'), fc = forecast(), lines = [];
  if (w && w.dur > 0) lines.push(`За ${fmtDur(w.dur)}: ${w.diff < 0 ? 'минус ' + fmtN(-w.diff) + ' кг' : w.diff > 0 ? 'плюс ' + fmtN(w.diff) + ' кг' : 'вес без изменений'} (было ${fmtN(w.from)}, стало ${fmtN(w.to)}).`);
  for (const [f, l] of [['waist','Талия'],['hips','Бёдра']]){
    const c = change(f); if (c && c.dur > 0) lines.push(`${l}: ${fmtN(c.from)} → ${fmtN(c.to)} см (${signed(c.diff)} см).`);
  }
  let body;
  if (!fc) body = pr.goal === 'keep'
    ? `<p class="small muted">Цель — держать вес. Колебания в пределах 1–2 кг — это нормально.</p>`
    : `<p class="small muted">Укажи желаемый вес в профиле — и я посчитаю, сколько примерно времени понадобится.</p><button class="btn line sm" data-act="tab" data-v="profile">Указать цель</button>`;
  else if (fc.done) body = `<p><b>Цель достигнута — поздравляем!</b> Теперь задача — удержать результат: поменяй цель в профиле на «Держать вес».</p>`;
  else body = `<p>До цели <b class="tnum">${fmtN(fc.left)} кг</b>.${fc.weeks ? ` Если держаться нормы (${pr.goal === 'lose' ? 'дефицит' : 'запас'} около ${fmtN(fc.delta,0)} ккал в день), вес будет ${pr.goal === 'lose' ? 'уходить' : 'расти'} примерно на ${fmtN(fc.weekly)} кг в неделю: до цели <b>примерно ${fmtSpan(fc.weeks)}</b> (ориентир — ${fmtMonth(fc.weeks)}).` : ''}</p>
    ${fc.paceWeeks ? `<p class="small">По твоим замерам темп сейчас ${fmtN(Math.abs(fc.pace))} кг в неделю — при нём цель примерно через ${fmtSpan(fc.paceWeeks)}.</p>` : ''}

/* если вес вырос с прошлого замера — объясняем, что это нормально */
function jumpCard(ws){
  if (ws.length < 2 || S.profile.goal === 'gain') return '';
  const a = ws[ws.length-2], b = ws[ws.length-1], up = r1(b.kg - a.kg);
  if (up <= 0) return '';
  const ci = cycleWaterDays(b.d);
  return `<div class="tip"><b>Вес вырос на ${fmtN(up)} кг — это нормально</b>
    ${ci ? `<p class="small">В день замера был ${ci.day}-й день цикла: перед месячными и в первые дни организм задерживает воду, и вес часто прибавляет. Через несколько дней это уходит.</p>` : ''}
    <p class="small">Вес колеблется на 0,3–1 кг за день: вода, соль, цикл, поздний ужин. Смотри на тренд за 2–3 недели и на объёмы талии и бёдер — они часто уходят раньше веса.</p></div>`;
}

function weightChart(all, target){
  let pts = all;
  if (range === '30'){ const from = dkey(addDays(new Date(), -30)); pts = all.filter(w => w.d >= from); }
  if (pts.length < 2) return `<p class="muted small">Добавьте хотя бы два замера веса, и здесь появится график.</p>`;
  const W = 340, H = 190, L = 34, R = 40, T = 14, B = 24;
  const t0 = parseKey(pts[0].d).getTime(), t1 = parseKey(pts[pts.length-1].d).getTime();
  let lo = Math.min(...pts.map(p => p.kg)), hi = Math.max(...pts.map(p => p.kg));
  const showT = target && target >= lo - 3 && target <= hi + 3;
  if (showT){ lo = Math.min(lo, target); hi = Math.max(hi, target); }
  const span = Math.max(hi - lo, 1), step = span <= 2 ? 0.5 : span <= 6 ? 1 : span <= 12 ? 2 : 5;
  lo = Math.floor((lo - step*0.3)/step)*step; hi = Math.ceil((hi + step*0.3)/step)*step;
  const x = t => L + (t1 === t0 ? 0.5 : (t - t0)/(t1 - t0))*(W - L - R);
  const y = v => T + (hi - v)/(hi - lo)*(H - T - B);
  let grid = '';
  for (let v = lo; v <= hi + 1e-9; v += step){
    grid += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="lbl" x="${L - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${fmtN(v)}</text>`;
  }
  const xy = pts.map(p => [x(parseKey(p.d).getTime()), y(p.kg)]);
  const line = xy.map((q,i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
  const area = line + ` L${xy[xy.length-1][0].toFixed(1)} ${H - B} L${xy[0][0].toFixed(1)} ${H - B} Z`;
  const last = xy[xy.length-1], lastKg = pts[pts.length-1].kg;
  const tl = showT ? `<line class="tg" x1="${L}" x2="${W - R}" y1="${y(target).toFixed(1)}" y2="${y(target).toFixed(1)}"/><text class="tgl" x="${W - R + 4}" y="${(y(target) + 4).toFixed(1)}">цель</text>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Вес с ${fmtShort(pts[0].d)} по ${fmtShort(pts[pts.length-1].d)}: от ${fmtN(pts[0].kg)} до ${fmtN(lastKg)} кг">
    ${grid}${tl}
    <path class="ar" d="${area}"/><path class="ln" d="${line}"/>
    ${xy.slice(0,-1).map(q => `<circle class="dot" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="2.6"/>`).join('')}
    <circle class="end" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="5"/>
    <text class="endl" x="${(last[0] + 8).toFixed(1)}" y="${(last[1] + 4).toFixed(1)}">${fmtN(lastKg)}</text>
    <text class="lbl" x="${L}" y="${H - 6}">${fmtShort(pts[0].d)}</text>
    <text class="lbl" x="${W - R}" y="${H - 6}" text-anchor="end">${fmtShort(pts[pts.length-1].d)}</text>
  </svg>${!showT && target ? `<p class="small muted">Цель: ${fmtN(target)} кг</p>` : ''}`;
}

/* --- Bluetooth-пульсометр (стандартный профиль Heart Rate) --- */
const bt = { status:'idle', bpm:null, dev:null, msg:'' };
const heartSVG = beat => `<svg class="heart ${beat ? 'beat' : ''}" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.5-4.6-9.5-9.3C1.1 8.3 3.3 4.5 7 4.5c2 0 3.5 1.1 5 2.9 1.5-1.8 3-2.9 5-2.9 3.7 0 5.9 3.8 4.5 7.2C19.5 16.4 12 21 12 21z"/></svg>`;
function btHTML(){
  const head = `<div><h2>Пульсометр по Bluetooth</h2></div>`;
  if (bt.status === 'live') return `${head}
    <div class="bt-live">${heartSVG(true)}<div><b class="num bt-bpm">${bt.bpm ?? '…'}</b> <span class="muted">уд/мин</span><div class="small muted">${esc(bt.dev && bt.dev.name || 'Датчик')} подключён</div></div></div>
    <div class="grid2"><button class="btn" data-act="bt-save" ${bt.bpm ? '' : 'disabled'}>Сохранить замер</button><button class="btn line" data-act="bt-off">Отключить</button></div>`;
  if (bt.status === 'connecting') return `${head}<p class="small muted">Выберите устройство в списке и дождитесь подключения…</p>`;
  const note = bt.status === 'unsupported'
    ? `<p class="small bad">Этот браузер не поддерживает Bluetooth. На Android откройте приложение в Chrome.</p>`
    : bt.status === 'error' ? `<p class="small bad">${esc(bt.msg)}</p>` : '';
  return `${head}
    <p class="small muted">Подходят нагрудные датчики пульса и часы с функцией «трансляция пульса» (она есть у многих Garmin, Amazfit, Xiaomi, Polar). Работает в Chrome на Android.</p>
    ${note}
    <button class="btn ghost" data-act="bt-connect">Подключить датчик</button>`;
}
function renderBT(){ const el = $('bt-box'); if (el) el.innerHTML = btHTML(); }
async function btConnect(){
  if (!navigator.bluetooth){ bt.status = 'unsupported'; renderBT(); return; }
  try {
    bt.status = 'connecting'; renderBT();
    const dev = await navigator.bluetooth.requestDevice({ filters:[{ services:['heart_rate'] }] });
    bt.dev = dev;
    dev.addEventListener('gattserverdisconnected', () => { bt.status = 'idle'; bt.bpm = null; renderBT(); });
    const server = await dev.gatt.connect();
    const svc = await server.getPrimaryService('heart_rate');
    const ch = await svc.getCharacteristic('heart_rate_measurement');
    ch.addEventListener('characteristicvaluechanged', e => {
      const v = e.target.value, flags = v.getUint8(0);
      bt.bpm = (flags & 1) ? v.getUint16(1, true) : v.getUint8(1);
      const el = document.querySelector('.bt-bpm'); if (el) el.textContent = bt.bpm; else renderBT();
      const sb = document.querySelector('[data-act="bt-save"]'); if (sb) sb.disabled = false;
    });
    await ch.startNotifications();
    bt.status = 'live'; renderBT();
  } catch(err){
    if (err && err.name === 'NotFoundError'){ bt.status = 'idle'; }
    else { bt.status = 'error'; bt.msg = (err && err.name === 'SecurityError')
      ? 'Браузер не дал доступ к Bluetooth. Установите приложение на телефон и откройте его в Chrome.'
      : 'Не удалось подключиться. Проверьте, что на часах включена трансляция пульса, и попробуйте ещё раз.'; }
    renderBT();
  }
}

function onProfileInput(el){
  const p = S.profile, v = el.value;
  switch (el.id){
    case 'pf-name': p.name = v.trim(); break;
    case 'pf-sex': p.sex = v; break;
    case 'pf-age': if (+v >= 14 && +v <= 99) p.age = +v; break;
    case 'pf-height': if (+v >= 120 && +v <= 230) p.height = +v; break;
    case 'pf-activity': p.activity = +v; break;
    case 'pf-goal': p.goal = v; break;
    case 'pf-target': { const x = Number(String(v).replace(',', '.')); p.target = x >= 30 && x <= 250 ? x : null; break; }
    case 'pf-weight': {
      const kg = r1(+String(v).replace(',', '.'));
      if (kg >= 25 && kg <= 300){ const t = todayKey(), ex = S.weights.find(w => w.d === t); upsertWeight(t, kg, ex && ex.waist, ex && ex.hips); }
      break; }
    default: return;
  }
  save();
  const out = $('pf-out'); if (out) out.innerHTML = normHTML();
}

const bot = { mode:null, run:0, resolve:null, spec:null };
const reducedMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const pause = ms => new Promise(r => setTimeout(r, reducedMotion() ? 0 : ms));
function chatScroll(){ const log = $('chat-log'); log.scrollTop = log.scrollHeight; }
function bubble(cls, content){
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  if (content && content.html) el.innerHTML = content.html; else el.textContent = content;
  $('chat-msgs').appendChild(el); chatScroll(); return el;
}
async function botSay(...lines){
  const run = bot.run;
  for (const line of lines){
    const t = bubble('bot typing', '•••');
    await pause(420);
    if (run !== bot.run) return;
    t.remove(); bubble('bot', line);
  }
}
function setFoot(spec){
  bot.spec = spec || null;
  const f = $('chat-foot');
  if (!spec){ f.innerHTML = ''; return; }
  if (spec.replies){
    f.innerHTML = `<div class="replies ${spec.col ? 'col' : ''}">${spec.replies.map(([l], i) => `<button class="reply" data-act="bot-reply" data-i="${i}">${esc(l)}</button>`).join('')}</div>`;
  } else {
    const n = spec.input.type !== 'text';
    f.innerHTML = `<form class="chat-form" id="chat-form">
      <input id="chat-in" ${n ? `type="text" inputmode="decimal" autocomplete="off" step="${spec.input.step || 1}"` : 'type="text" maxlength="30" autocomplete="given-name"'} placeholder="${esc(spec.input.placeholder || '')}" aria-label="${esc(spec.input.placeholder || 'Ответ')}" required>
      ${spec.input.unit ? `<span class="unit">${esc(spec.input.unit)}</span>` : ''}
      <button class="btn" type="submit">Ответить</button></form><div class="chat-hint" id="chat-hint"></div>`;
    const i = $('chat-in'); if (i) i.focus({ preventScroll:true });
  }
}
function waitAnswer(spec){ return new Promise(res => { bot.resolve = res; setFoot(spec); }); }
function answer(value, label){
  if (!bot.resolve) return;
  const res = bot.resolve; bot.resolve = null; setFoot(null);
  bubble('me', label); res(value);
}
function openBot(mode){
  bot.mode = mode; bot.run++; bot.resolve = null;
  $('chat-msgs').innerHTML = ''; setFoot(null);
  $('chat-sub').textContent = mode === 'survey' ? 'анкета: норма и программа' : 'частые вопросы';
  $('chat').hidden = false; document.body.style.overflow = 'hidden';
  (mode === 'survey' ? survey() : faq()).catch(() => {});
}
function closeBot(){
  if (bot.mode === 'survey' && !S.onboarded){ S.onboarded = true; save(); }
  bot.run++; bot.resolve = null; bot.mode = null;
  $('chat').hidden = true; document.body.style.overflow = '';
  RENDER[view]();
}

  const alive = () => run === bot.run;
  await botSay('Привет! Я помощник «Тонуса».', 'Задам несколько вопросов, посчитаю твою норму калорий, белка и воды и предложу программу. Это займёт около минуты.');
  if (!alive()) return;
  await waitAnswer({ replies:[['Начнём', 1]] });
  await botSay('Как тебя зовут?');

  await botSay('Сколько тебе лет?');

  await botSay('А сколько ты весишь сейчас?');

  await botSay('Насколько много ты двигаешься в обычную неделю?');
  d.activity = await waitAnswer({ replies: ACTIVITY.map(([v,l]) => [l, v]), col:true });
  await botSay('Какая у тебя цель?');
  d.goal = await waitAnswer({ replies: GOALS.map(([v,l]) => [l, v]) });
  d.target = null;
  if (d.goal !== 'keep'){
    await botSay('Сколько ты хочешь весить? Это будет твоя цель.');
    d.target = await waitAnswer({ input:{ min:30, max:250, step:0.5, unit:'кг', placeholder:'Желаемый вес',
      check: v => d.goal === 'lose' ? (v < d.weight || 'Для снижения веса цель должна быть меньше текущего веса')
                                    : (v > d.weight || 'Для набора веса цель должна быть больше текущего веса') } });
  }
  await botSay('Вес колеблется изо дня в день — это нормально, важнее тренд за несколько недель. Как часто напоминать тебе о взвешивании?');
  d.weighEvery = await waitAnswer({ replies: WEIGH_EVERY.map(([v,l]) => [l, v]), col:true });
  await botSay('Как у тебя со сном и энергией?');
  d.concern = await waitAnswer({ replies: CONCERNS.map(([v,l]) => [l, v]), col:true });
  await botSay('И важный вопрос о здоровье. Что-то из этого про тебя?');
  const health = [['Хронические заболевания или приём лекарств','chronic'],['Ничего из этого','none']];
  if (d.sex === 'f') health.unshift(['Беременность или кормление грудью','preg']);
  d.health = await waitAnswer({ replies:health, col:true });
  if (!alive()) return;

  // сохраняем профиль и считаем норму
  Object.assign(S.profile, { name:d.name, sex:d.sex, age:d.age, height:d.height, activity:d.activity, goal:d.goal, target:d.target,
    weighEvery:d.weighEvery, concern:d.concern, health:d.health });
  upsertWeight(todayKey(), r1(d.weight));
  S.onboarded = true; save();
  const g = goals(), fc = forecast();
  await botSay(`Готово, ${d.name}! Твоя норма на день:\n• ${fmtN(g.kcal,0)} ккал\n• белок — ${g.p} г\n• вода — ${fmtN(g.water/1000,1)} л`,
    'Расчёт по формуле Миффлина — Сан Жеора с учётом активности и цели. Это ориентир, а не медицинская рекомендация.');
  if (fc && fc.weeks) await botSay(`Если держаться нормы, до цели ${fmtN(fc.left)} кг — примерно ${fmtSpan(fc.weeks)}. Это честный ориентир: вес уходит неравномерно, бывают остановки — это нормально. Следить за путём можно в «Прогрессе».`);
  if (d.sex === 'f' && d.age >= 45) await botSay('После 45 вес часто уходит медленнее — это нормально, тело перестраивается. Помогают белок в каждом приёме пищи, силовые упражнения и хороший сон. Темп 0,3–0,5 кг в неделю — хороший результат.');
  const tips = { sleep:'Про сон: проветривай спальню, ложись в одно и то же время и откладывай телефон за час до сна.',
    energy:'Про энергию: не пропускай завтрак, пей воду по норме и выходи на короткие прогулки.',
    stress:'Когда тревожно, помогает медленное дыхание: вдох на 4 счёта, выдох на 6. Ещё — прогулка, тёплый душ, спокойная музыка.' }[d.concern];
  if (tips) await botSay(tips + ' Такие советы будут на экране «Сегодня». Если это беспокоит долго — обратись к врачу.'

  let offer = true;

  } else if (d.health === 'chronic'){
    await botSay(`Ты ${sx('отметил','отметила')} хронические заболевания или приём лекарств. Перед началом любой программы с продуктами обязательно посоветуйся с врачом — особенно если принимаешь лекарства. Я не врач и не консультирую.`);
  }
  if (offer){
    await botSay('Хочешь начать программу с продуктами NL? На экране «Сегодня» появится список: что и когда принимать.');
    const pid = await waitAnswer({ replies: PROGRAMS.map(p => [`${p.name} · ${p.days} дн.`, p.id]).concat([['Пока без программы','none']]), col:true });
    if (pid !== 'none'){
      const pr = progById(pid), t = todayKey();
      S.program = { id:pid, start:t }; S.checks[t] = {}; save();
      await botSay(`Начинаем «${pr.name}»:\n` + pr.plan.map(i => `• ${i.when}: ${i.text}`).join('\n'),
        'Что понадобится на всю программу:\n' + programBasket(pr).map(b => `• ${b.p.name} — ${b.need}`).join('\n'),
        'Перед началом прочитай инструкцию к каждому продукту. Ссылки на продукты — в «Продуктах», в карточке программы. Отмечать приём можно на экране «Сегодня».');
    }
  }
  await botSay('Всё готово! Поменять данные можно в «Профиле», а ответы на частые вопросы — у меня в разделе «Есть вопрос?».');
  await waitAnswer({ replies:[['Перейти к дневнику', 1]] });
  if (alive()){ closeBot(); show('today'); }
}

async function faq(){
  const run = bot.run;
  const topics = () => waitAnswer({ replies: FAQ.map((g, k) => [g.t, k]).concat([['Закрыть', 'close']]), col:true });
  await botSay('Привет! Я отвечу на частые вопросы. Выбери тему:');
  let cat = await topics();
  while (run === bot.run){
    if (cat === 'close'){ closeBot(); return; }
    const g = FAQ[cat];
    const i = await waitAnswer({ replies: g.items.map((f, k) => [f.q, k]).concat([['← Другая тема', 'back']]), col:true });
    if (i === 'back'){ await botSay('Выбери тему:'); cat = await topics(); continue; }
    await botSay(...g.items[i].a);
    if (run !== bot.run) return;
    const next = await waitAnswer({ replies:[['Ещё вопрос по теме','more'],['Другая тема','topics'],['Закрыть','close']] });
    if (next === 'close'){ closeBot(); return; }
    if (next === 'topics'){ await botSay('Выбери тему:'); cat = await topics(); }
  }
}

let view = 'today';

function show(v, to){
  view = VIEWS.includes(v) ? v : 'today';
  VIEWS.forEach(id => { $('v-' + id).hidden = id !== view; });

function openSheet(){ $('sheet').hidden = false; document.body.style.overflow = 'hidden'; const b = $('sheet-body').querySelector('button'); if (b) b.focus({ preventScroll:true }); }

let toastTimer = null, toastUndo = null;
function toast(msg, undo){
  const el = $('toast');
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button data-act="undo">Вернуть</button>' : ''}`;
  el.hidden = false; toastUndo = undo || null;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; toastUndo = null; }, undo ? 5000 : 2600);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, t = todayKey(), d = b.dataset;
  switch (a){
    case 'tab': closeSheet(); show(d.v, d.to); break;
    case 'bot-open': closeSheet(); openBot(d.mode); break;
    case 'bot-close': closeBot(); break;
    case 'bot-reply': { const r = bot.spec && bot.spec.replies && bot.spec.replies[+d.i]; if (r) answer(r[1], r[0]); break; }
    case 'add-food': openAddFood(d.meal, d.day); break;
    case 'water-add': S.water[t] = Math.max(0, (S.water[t] || 0) + Number(d.ml)); commit(); break;
    case 'water-set': { const n = +d.n, cur = Math.floor((S.water[t] || 0)/250); S.water[t] = (n === cur ? n - 1 : n)*250; commit(); break; }
    case 'mood': S.mood[t] = S.mood[t] === +d.n ? undefined : +d.n; commit(); break;
    case 'sleep': S.sleep[t] = Math.min(14, Math.max(0, (S.sleep[t] || 0) + Number(d.d))); commit(); break;
    case 'check': {
      const pr = progById(S.program.id), it = pr.plan.find(i => i.id === d.id), day = S.checks[t] || (S.checks[t] = {});
      if (day[it.id]){
        if (typeof day[it.id] === 'string') S.meals[t] = (S.meals[t] || []).filter(x => x.id !== day[it.id]);
        delete day[it.id]; commit();
      } else {
        const p = prod(it.product);
        if (countsKcal(p)){
          const en = entryFromProduct(p.id, WHEN_TO_MEAL[it.when] || mealByTime(), 1);
          (S.meals[t] || (S.meals[t] = [])).push(en); day[it.id] = en.id; commit();
          toast(`Отмечено и добавлено в дневник: ${en.kcal} ккал`);
        } else { day[it.id] = true; commit(); }
      }
      break; }
    case 'day': { const n = addDays(parseKey(foodDay), +d.d); if (dkey(n) <= t){ foodDay = dkey(n); renderFood(); } break; }
    case 'del-entry': {
      for (const k of Object.keys(S.meals)){
        const i = S.meals[k].findIndex(x => x.id === d.id);
        if (i < 0) continue;
        const [gone] = S.meals[k].splice(i, 1);
        const ch = S.checks[k] || {}, link = Object.keys(ch).find(key => ch[key] === gone.id);
        if (link) delete ch[link];
        commit();
        toast(`Удалено: ${gone.name}`, () => { S.meals[k].splice(i, 0, gone); if (link) (S.checks[k] || (S.checks[k] = {}))[link] = gone.id; commit(); });
        break;
      }
      break; }
    case 'undo': if (toastUndo){ const f = toastUndo; toastUndo = null; $('toast').hidden = true; f(); } break;
    case 'sheet-close': closeSheet(); break;
    case 'pick-meal': sh.meal = d.m; renderSheet(); break;
    case 'sheet-tab': sh.tab = d.t; sh.pick = null; renderSheet(); break;
    case 'pick-food': sh.pick = +d.i; renderSheet(); { const g = $('g-grams'); if (g){ g.focus(); g.select(); } } break;
    case 'food-grp': sh.fc = d.c; sh.q = ''; sh.pick = null; renderSheet(); break;
    case 'wo-open': closeSheet(); openWorkout(); break;
    case 'wo-type': { const m = Number($('wo-min').value); if (m > 0) sh.min = m; sh.type = d.t; renderSheet(); break; }
    case 'del-wo': {
      const list = S.workouts[t] || [], i = list.findIndex(w => w.id === d.id); if (i < 0) break;
      const [gone] = list.splice(i, 1); commit();
      toast(`Удалено: ${gone.type}`, () => { list.splice(i, 0, gone); S.workouts[t] = list; commit(); }); break; }
    case 'notes-hide': S.notesHidden = t; commit(); toast('Скрыто до завтра. Выключить совсем можно в «Профиле»'); break;
    case 'back-hide': S.back = null; commit(); break;
    case 'test-back': S.back = { d:t, missed:Number(d.n) }; commit(); window.scrollTo(0, 0); break;
    case 'toggle-hints': S.profile.hints = S.profile.hints === false; commit(); break;
    case 'toggle-xe': S.profile.xe = !S.profile.xe; commit(); break;
    case 'supp-open': closeSheet(); openSupp(d.id); break;
    case 'toggle-cycle': S.profile.cycle = S.profile.cycle === false; commit(); break;
    case 'del-period': {
      const i = S.periods.indexOf(d.d); if (i < 0) break;
      S.periods.splice(i, 1); commit();
      toast(`Удалена отметка за ${fmtDay(d.d)}`, () => { S.periods.push(d.d); commit(); }); break; }
    case 'supp-when': sh.when = d.w; document.querySelectorAll('[data-act="supp-when"]').forEach(c => c.classList.toggle('on', c.dataset.w === d.w)); break;
    case 'supp-check': { const day = S.suppChecks[t] || (S.suppChecks[t] = {}); if (day[d.id]) delete day[d.id]; else day[d.id] = true; commit(); break; }
    case 'supp-del': {
      const i = S.supps.findIndex(s => s.id === d.id); if (i < 0) break;
      const [gone] = S.supps.splice(i, 1); commit();
      toast(`Удалено: ${gone.name}`, () => { S.supps.splice(i, 0, gone); commit(); }); break; }
    case 'menu-open': closeSheet(); openMenu(); break;
    case 'menu-tab': sh.tab = d.t; renderSheet(); break;
    case 'menu-day': sh.md = +d.i; renderSheet(); break;
    case 'menu-add': {
      const items = menuPlan(sh.md).meals[d.m], list = S.meals[sh.day] || (S.meals[sh.day] = []);
      items.forEach(x => { const en = x.nl ? entryFromProduct(x.nl.id, d.m, 1) : entryFromFood(x.f, d.m, x.g); if (en) list.push(en); });
      commit(); toast(`${mealName(d.m)} добавлен в дневник: ${fmtN(items.reduce((a,x) => a + x.kcal, 0),0)} ккал`); break; }
    case 'rec-add': {
      const r = RECIPES[+d.i], s = recipeTotals(r);
      (S.meals[sh.day] || (S.meals[sh.day] = [])).push({ id:uid(), meal:mealByTime(), name:r.name, amount:'1 порция',
        kcal:Math.round(s.kcal), p:r1(s.p), f:r1(s.f), c:r1(s.c) });
      commit(); toast(`Добавлено: ${r.name}, ${Math.round(s.kcal)} ккал`); break; }
    case 'add-product': {
      const meal = sh && sh.kind === 'add' ? sh.meal : mealByTime(), day = sh && sh.kind === 'add' ? sh.day : t;
      const en = entryFromProduct(d.id, meal, 1); closeSheet(); if (en) addEntry(day, en); break; }
    case 'open-product': openProduct(d.id); break;
    case 'nl-cat': sh.pc = d.c; renderSheet(); break;
    case 'cat-cat': catC = d.c; renderProducts(); break;
    case 'cat-goal': catG = d.g; renderProducts(); break;
    case 'goal-open': catG = d.g; catC = ''; catQ = ''; closeSheet(); show('products', 'goal-chips'); break;
    case 'start-program':
      S.program = { id:d.id, start:t }; S.checks[t] = {}; save(); closeSheet();
      show('today'); toast(`Программа «${progById(d.id).name}» начата`); break;
    case 'stop-program': S.program = null; commit(); toast('Программа остановлена'); break;
    case 'range': range = d.r; renderProgress(); break;
    case 'del-weight': {
      const i = S.weights.findIndex(w => w.d === d.d); if (i < 0) break;
      const [gone] = S.weights.splice(i, 1); commit();
      toast(`Удалена запись за ${fmtShort(gone.d)}`, () => { S.weights.push(gone); commit(); }); break; }
    case 'del-pulse': {
      const i = S.pulse.findIndex(x => String(x.t) === d.t); if (i < 0) break;
      const [gone] = S.pulse.splice(i, 1); commit();
      toast('Замер удалён', () => { S.pulse.splice(i, 0, gone); commit(); }); break; }
    case 'bt-connect': btConnect(); break;
    case 'bt-off': try { bt.dev && bt.dev.gatt.disconnect(); } catch(err){} bt.status = 'idle'; bt.bpm = null; renderBT(); break;
    case 'bt-save': if (bt.bpm){ S.pulse.push({ t:Date.now(), bpm:bt.bpm, src:'bt' }); save(); renderProgress(); toast(`Сохранено: ${bt.bpm} уд/мин`); } break;
    case 'clear-demo': S = blank(); save(); show('profile'); toast('Примеры удалены. Заполните свой профиль'); break;
    case 'install': if (installEvt){ installEvt.prompt(); installEvt = null; renderProfile(); } break;
    case 'reset': resetAsk = true; renderProfile(); break;
    case 'reset-no': resetAsk = false; renderProfile(); break;
    case 'reset-yes': resetAsk = false; S = blank(); save(); show('today'); toast('Все записи удалены'); break;
  }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, t = todayKey(), num = id => { const v = $(id).value.trim().replace(',', '.'); if (v === '') return null; const x = Number(v); return Number.isFinite(x) ? x : null; };
  if (f.id === 'w-form'){
    const kg = num('w-kg'); if (!(kg >= 25 && kg <= 300)) return;
    const d = $('w-date').value || t;
    upsertWeight(d > t ? t : d, r1(kg), num('w-waist'), num('w-hips'));
    commit(); toast(`Вес ${fmtN(kg)} кг сохранён`);
  } else if (f.id === 'p-form'){
    const bpm = num('p-bpm'); if (!(bpm >= 30 && bpm <= 220)) return;
    const sys = num('p-sys'), dia = num('p-dia');
    S.pulse.push({ t:Date.now(), bpm:Math.round(bpm), sys: sys && dia ? Math.round(sys) : null, dia: sys && dia ? Math.round(dia) : null, src:'manual' });
    commit(); toast('Замер сохранён');
    requestAnimationFrame(() => { const el = $('health'); if (el) el.scrollIntoView({ block:'start' }); });
  } else if (f.id === 'chat-form' && bot.spec && bot.spec.input){
    const sp = bot.spec.input, raw = $('chat-in').value.trim(), hint = $('chat-hint');
    if (sp.type === 'text'){
      if (!raw) return;
      answer(raw.slice(0, 30), raw.slice(0, 30));
    } else {
      const v = Number(raw.replace(',', '.'));
      if (!(v >= sp.min && v <= sp.max)){ hint.textContent = `Введите число от ${sp.min} до ${sp.max}`; return; }
      const ok = sp.check ? sp.check(v) : true;
      if (ok !== true){ hint.textContent = ok; return; }
      answer(sp.step && sp.step < 1 ? r1(v) : Math.round(v), fmtN(v) + (sp.unit ? ' ' + sp.unit : ''));
    }
  } else if (f.id === 'cycle-form'){
    let d = $('cycle-date').value || t; if (d > t) d = t;
    if (!S.periods.includes(d)) S.periods.push(d);
    commit(); toast(`Отмечено: начало месячных ${fmtDay(d)}`);
  } else if (f.id === 'supp-form'){
    const name = $('supp-name').value.trim(); if (!name) return;
    const p = PRODUCTS.find(x => x.name === name);
    S.supps.push({ id:uid(), name, pid: p ? p.id : null, when:sh.when, note:$('supp-note').value.trim() });
    closeSheet(); commit(); toast(`Добавлено в мои добавки: ${name}`);
  } else if (f.id === 'steps-form'){
    const n = num('steps-in'); if (!(n >= 0 && n <= 100000)) return;
    S.steps[t] = Math.round(n); commit(); toast(`Записано: ${fmtN(n,0)} ${plural(Math.round(n), 'шаг', 'шага', 'шагов')}`);
  } else if (f.id === 'wo-form'){
    const min = num('wo-min'); if (!(min > 0 && min <= 600)) return;
    const w = { id:uid(), type:sh.type, min:Math.round(min), kcal:workoutKcal(sh.type, min) };
    (S.workouts[t] || (S.workouts[t] = [])).push(w);
    closeSheet(); commit(); toast(`Тренировка добавлена: ${w.type}, ${w.min} мин`);
  } else if (f.id === 'g-form'){
    const g = num('g-grams'); if (!(g > 0)) return;
    const en = entryFromFood(FOODS[sh.pick], sh.meal, g), day = sh.day; closeSheet(); addEntry(day, en);
  } else if (f.id === 'own-form'){
    const name = $('own-name').value.trim(), kcal = num('own-kcal'); if (!name || kcal == null) return;
    const en = { id:uid(), meal:sh.meal, name, amount:$('own-amount').value.trim() || '1 порция',
      kcal:Math.round(kcal), p:num('own-p') || 0, f:num('own-f') || 0, c:num('own-c') || 0 };
    const day = sh.day; closeSheet(); addEntry(day, en);
  }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'food-q' && sh){ sh.q = el.value; $('food-list').innerHTML = foodListHTML(); }
  else if (el.id === 'nl-q' && sh){ sh.pq = el.value; $('nl-list').innerHTML = nlRows(); }
  else if (el.id === 'cat-q'){ catQ = el.value; const list = catalogList(); $('cat-list').innerHTML = catalogRows(list); $('cat-count').textContent = list.length + ' из ' + PRODUCTS.length; }
  else if (el.id === 'g-grams' && sh && sh.pick != null){ const g = Number(el.value) || 0; $('g-calc').textContent = Math.round(FOODS[sh.pick].kcal*g/100) + ' ккал'; }
  else if (el.id === 'wo-min' && sh && sh.kind === 'wo'){ sh.min = Number(el.value) || 0; $('wo-kcal').textContent = '≈ ' + workoutKcal(sh.type, sh.min) + ' ккал'; }
  else if (el.closest && el.closest('#pf') && el.id !== 'pf-weight') onProfileInput(el);
});
document.addEventListener('change', e => {
  if (e.target.id === 'pf-weight') onProfileInput(e.target);
  else if (e.target.id === 'st-weigh'){ S.profile.weighEvery = Number(e.target.value); save(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('chat').hidden) closeBot(); else if (!$('sheet').hidden) closeSheet();
});

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (view === 'profile') renderProfile(); });

/* офлайн-режим: только в установленной версии на своём сайте */
if ('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]')){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

const start = location.hash.slice(1);
noteVisit();
show(VIEWS.includes(start) ? start : 'today');
/* установленное приложение может днями висеть в памяти телефона — новый день отмечаем и при возврате в него */
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && noteVisit() && view === 'today') renderToday(); });
/* первый запуск клиентской версии — анкета помощника */
if (!S.demo && !S.onboarded && !S.profile.name && !S.weights.length) openBot('survey');
})();
</script>
