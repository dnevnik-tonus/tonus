<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тонус</title>
<meta name="theme-color" content="#0A7A73">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Тонус">
<meta name="author" content="Дмитрий и Екатерина Мёдовы, бизнес-партнёры NL">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>window.APP_MODE = 'release';</script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: phone-first single column, fixed bottom tab bar; cards only for the daily blocks */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --ink:#13211C; --muted:#5A6A64; --line:#DCE3DF;
  --accent:#0A7A73; --accent-ink:#FFFFFF; --accent-soft:#D5ECE9;
  --warm:#D9772B; --warm-soft:#FBE7D6; --water:#2B78CF; --water-soft:#DCE9F8;
  --good:#23824F; --bad:#C0392F;
  --shadow:0 1px 2px rgba(19,33,28,.06),0 6px 18px rgba(19,33,28,.06);
  --f-display:'Unbounded','Onest',system-ui,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1614; --surface:#18221F; --ink:#E6EEEA; --muted:#94A39D; --line:#2A3632;
    --accent:#3DBDB2; --accent-ink:#06221F; --accent-soft:#163A36;
    --warm:#F0A060; --warm-soft:#3A2717; --water:#6AA6EE; --water-soft:#17283D;
    --good:#5CC48A; --bad:#EF7A70; --shadow:0 0 0 1px #24302C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#18221F; --ink:#E6EEEA; --muted:#94A39D; --line:#2A3632;
  --accent:#3DBDB2; --accent-ink:#06221F; --accent-soft:#163A36;
  --warm:#F0A060; --warm-soft:#3A2717; --water:#6AA6EE; --water-soft:#17283D;
  --good:#5CC48A; --bad:#EF7A70; --shadow:0 0 0 1px #24302C;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}

.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(100px + env(safe-area-inset-bottom,0px))}
.view{display:grid;gap:14px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:4px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--f-display);font-weight:600;font-size:25px;line-height:1.18;margin:4px 0 0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:17px;font-weight:700;margin:0;line-height:1.3}
h3{font-size:14px;font-weight:700;margin:14px 0 4px}
p{margin:0}
.small{font-size:13px}
.muted{color:var(--muted)}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-weight:500}
.tnum{font-variant-numeric:tabular-nums}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:8px}

.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:grid;gap:12px;min-width:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.btn{appearance:none;border:0;border-radius:12px;padding:11px 16px;font-weight:600;font-size:15px;cursor:pointer;background:var(--accent);color:var(--accent-ink);min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px}
.btn.wide{width:100%}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.x{appearance:none;border:0;background:transparent;width:36px;height:36px;border-radius:10px;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;flex:none}
.x:hover{background:var(--bg)}

input,select{font:inherit;font-size:16px;padding:9px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px;width:100%;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}

/* demo banner */
.demo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;border:1.5px dashed var(--accent);background:var(--accent-soft);font-size:14px}
.demo div{flex:1 1 200px;min-width:0}

/* calories */
.kcal{grid-template-columns:120px 1fr;align-items:center;gap:16px}
.kcal .btn{grid-column:1/-1}
.ring{width:120px;height:120px;display:block}
.ring-bg{fill:none;stroke:var(--warm-soft);stroke-width:11}
.ring-fg{fill:none;stroke:var(--warm);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring-fg.over{stroke:var(--bad)}
.ring-num{font-family:var(--f-display);font-size:23px;font-weight:600;fill:var(--ink);text-anchor:middle}
.ring-sub{font-size:10px;fill:var(--muted);text-anchor:middle}
.kcal-side{display:grid;gap:8px;min-width:0}
.big{font-size:26px;line-height:1.1}
.big small{font-family:var(--f-body);font-size:14px;color:var(--muted);font-weight:500}
.mb{display:grid;gap:3px}
.mb-top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);gap:6px}
.mb-track{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.mb-track i{display:block;height:100%;background:var(--accent);border-radius:4px}

/* program checklist */
.checks{display:grid;gap:6px}
.check{appearance:none;border:0;background:var(--bg);border-radius:12px;padding:11px 12px;display:flex;align-items:flex-start;gap:12px;text-align:left;cursor:pointer;min-height:44px;width:100%}
.check .box{flex:none;width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;margin-top:1px}
.check.on .box{background:var(--accent);box-shadow:none}
.check.on .box::after{content:"";width:10px;height:6px;border:2.5px solid var(--accent-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.check.on .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.check .when{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.progbar{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.progbar i{display:block;height:100%;background:var(--accent)}

/* water */
.glasses{display:flex;flex-wrap:wrap;gap:7px}
.glass{appearance:none;border:0;width:28px;height:38px;border-radius:5px 5px 10px 10px;background:var(--water-soft);cursor:pointer;position:relative;padding:0}
.glass.on{background:var(--water)}
.water-v{color:var(--water);font-weight:700}

/* mini stat cards */
.mini{appearance:none;border:0;text-align:left;cursor:pointer;background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);display:grid;gap:4px;align-content:start;min-width:0}
.mini .num{font-size:21px}
.mini .num small{font-family:var(--f-body);font-size:13px;color:var(--muted)}
.good{color:var(--good)} .bad{color:var(--bad)}

/* mood & sleep */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood{appearance:none;border:0;background:var(--bg);border-radius:12px;padding:8px 2px;display:grid;gap:2px;justify-items:center;cursor:pointer;min-height:56px}
.mood .num{font-size:18px}
.mood small{font-size:10.5px;color:var(--muted);line-height:1.15;text-align:center}
.mood.on{background:var(--accent);color:var(--accent-ink)}
.mood.on small{color:var(--accent-ink)}
.stepper{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:12px;padding:3px}
.stepper button{appearance:none;border:0;background:var(--surface);width:38px;height:38px;border-radius:10px;font-size:20px;cursor:pointer;box-shadow:var(--shadow)}
.stepper b{min-width:62px;text-align:center}

/* food diary */
.daynav{display:flex;align-items:center;gap:4px}
.daynav button{appearance:none;border:0;background:var(--surface);box-shadow:var(--shadow);width:40px;height:40px;border-radius:12px;font-size:20px;cursor:pointer}
.daynav button:disabled{opacity:.35;cursor:default}
.tot{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:8px}
.tot div{display:grid;gap:2px;min-width:0}
.tot .num{font-size:18px}
.tot span{font-size:12px;color:var(--muted)}
.meal{display:grid;gap:8px}
.entries{list-style:none;margin:0;padding:0;display:grid}
.entry{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.e-main{flex:1;min-width:0}
.e-name{font-weight:600;overflow-wrap:anywhere}
.e-kcal{font-size:15px;white-space:nowrap}
.empty{font-size:14px;color:var(--muted);padding:2px 0}

/* products */
.tile{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:15px;background:var(--warm-soft);color:var(--warm)}
.tile.sup{background:var(--accent-soft);color:var(--accent)}
.tile.oth{background:var(--bg);color:var(--muted)}
.tile.big{width:58px;height:58px;font-size:18px;border-radius:16px}
.plist{display:grid;gap:8px}
.prow{appearance:none;border:0;width:100%;text-align:left;cursor:pointer;background:var(--surface);border-radius:16px;padding:12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.prow .pm{flex:1;min-width:0}
.pn{font-weight:600;overflow-wrap:anywhere}
.prow.dim{opacity:.72}
.nlrow{padding:6px 0}
.pre{white-space:pre-line}
.infobox{display:grid;gap:8px;justify-items:start;background:var(--bg);border-radius:14px;padding:12px 14px}
details summary{cursor:pointer;font-weight:700;font-size:14px;margin-top:14px}
details p{margin-top:6px}
.prow .pk{font-size:14px;white-space:nowrap;color:var(--muted)}
.kbju{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kbju div{background:var(--bg);border-radius:12px;padding:10px 8px;display:grid;gap:2px;text-align:center}
.kbju .num{font-size:17px}
.kbju span{font-size:11.5px;color:var(--muted)}
.prog{display:grid;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);width:fit-content}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .lbl{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .end{fill:var(--accent)}
.chart .endl{fill:var(--ink);font-size:12px;font-weight:700;font-family:var(--f-body)}
.chart .tg{stroke:var(--good);stroke-width:1.5;stroke-dasharray:5 4}
.chart .tgl{fill:var(--good);font-size:11px;font-weight:600}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{appearance:none;border:0;background:transparent;border-radius:9px;padding:7px 10px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;flex:1;min-height:36px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);display:grid;gap:2px;min-width:0}
.stat .num{font-size:20px}
.stat .num small{font-family:var(--f-body);font-size:13px;color:var(--muted)}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.hist .hd{flex:1;min-width:0}

/* bluetooth */
.bt-live{display:flex;align-items:center;gap:14px}
.heart{width:44px;height:44px;flex:none;color:var(--bad)}
.heart.beat{animation:beat 1s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(1)}}
.bt-bpm{font-size:40px;line-height:1}

/* consultant */
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.how ol{margin:6px 0 0;padding-left:20px;display:grid;gap:4px;font-size:14px}
.norm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.norm div{background:var(--bg);border-radius:12px;padding:10px;display:grid;gap:2px}
.norm .num{font-size:18px}
.norm span{font-size:12px;color:var(--muted)}
.fine{font-size:12.5px;color:var(--muted);line-height:1.5}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{appearance:none;border:0;background:transparent;display:grid;justify-items:center;gap:3px;padding:9px 2px 8px;cursor:pointer;color:var(--muted);font-size:11px;font-weight:600;min-height:56px}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet-back{position:absolute;inset:0;background:rgba(8,14,12,.45)}
.sheet{position:relative;width:100%;max-width:560px;max-height:88vh;max-height:88dvh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:8px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.sheet-grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 2px}
.sheet-head{display:flex;align-items:center;gap:12px}
.sheet-head > div{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:0;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;background:var(--bg);color:var(--muted);cursor:pointer;min-height:36px;flex:none;white-space:nowrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.prodpage .chip{background:var(--surface);box-shadow:var(--shadow)}
.prodpage .chip.on{background:var(--ink);color:var(--surface)}
.chip.on{background:var(--ink);color:var(--surface)}
.pick{display:grid;gap:10px;background:var(--accent-soft);border-radius:14px;padding:12px}
.pick .row input{width:96px;flex:none}
.flist{display:grid}
.frow{appearance:none;border:0;background:transparent;text-align:left;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:11px 4px;border-top:1px solid var(--line);width:100%}
.frow:first-child{border-top:0}
.frow span:last-child{color:var(--muted);white-space:nowrap;font-size:14px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--surface);border-radius:14px;padding:11px 14px;font-size:14px;display:flex;gap:14px;align-items:center;width:max-content;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast button{appearance:none;border:0;background:transparent;color:var(--surface);font-weight:700;text-decoration:underline;cursor:pointer;padding:4px}

@media (max-width:360px){
  .kcal{grid-template-columns:1fr;justify-items:center}
  .kcal-side{width:100%}
  .tot{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

<div class="app">
  <section class="view" id="v-today"></section>
  <section class="view" id="v-food" hidden></section>
  <section class="view" id="v-progress" hidden></section>
  <section class="view" id="v-products" hidden></section>
  <section class="view" id="v-profile" hidden></section>
</div>

<nav class="tabs" aria-label="Разделы">
  <div class="tabs-in">
    <button class="tab" data-act="tab" data-v="today" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Сегодня</span></button>
    <button class="tab" data-act="tab" data-v="food"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v7a2 2 0 0 0 2 2v9M5 3v5.5M9 3v5.5"/><path d="M17 21V3c-2 1.2-3 3.6-3 7s1.2 4 3 4"/></svg><span>Питание</span></button>
    <button class="tab" data-act="tab" data-v="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16"/><path d="M5 16l4.5-4.5 3 3L19 8"/><path d="M15 8h4v4"/></svg><span>Прогресс</span></button>
    <button class="tab" data-act="tab" data-v="products"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 8h13l-1 12.5h-11z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg><span>Продукты</span></button>
    <button class="tab" data-act="tab" data-v="profile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.4-3.8 4.4-6 8-6s6.6 2.2 8 6"/></svg><span>Профиль</span></button>
  </div>
</nav>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet-back" data-act="sheet-close"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-grab"></div>
    <div id="sheet-body" style="display:grid;gap:12px"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="products.js"></script>
<script>
(function(){
'use strict';

/* ================================================================
   ПРОДУКТЫ NL — из products.js (его собирает make_products.py).
   kind: 'food' — питание, 'supplement' — БАД, 'other' — не едят.
   kcal/p/f/c — на порцию (basis); null — производитель не указал.
   ================================================================ */
/* Автор: по Стандартам NL (п. 6.2.2) ресурс партнёра подписывается его именем */
const AUTHOR = 'Дмитрий и Екатерина Мёдовы, бизнес-партнёры NL';
const PRODUCTS = window.NL_PRODUCTS || [];
const NL_META = window.NL_META || {};
const CATS = ['Здоровое питание','Похудение','БАД и адаптогены','Коллаген','Для детей','Антиэйдж'];

/* Программы — примеры схем на продуктах NL; дозировки и сроки строго по инструкциям NL.

/* ---------- утилиты ---------- */
const pad = n => String(n).padStart(2,'0');
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const todayKey = () => dkey(new Date());
const daysBetween = (a,b) => Math.round((parseKey(b) - parseKey(a)) / 864e5);
const fmtDay = k => parseKey(k).toLocaleDateString('ru-RU', { day:'numeric', month:'long' });
const fmtShort = k => parseKey(k).toLocaleDateString('ru-RU', { day:'numeric', month:'short' }).replace('.', '');
const fmtN = (n,d=1) => Number(n).toLocaleString('ru-RU', { maximumFractionDigits:d }).replace('-', '−');
const r1 = n => Math.round(n*10)/10;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const $ = id => document.getElementById(id);
const prod = id => PRODUCTS.find(p => String(p.id) === String(id));
const progById = id => PROGRAMS.find(p => p.id === id);
const mealName = m => (MEALS.find(x => x[0] === m) || MEALS[0])[1];
const relDay = k => { const n = daysBetween(k, todayKey()); return n === 0 ? 'Сегодня' : n === 1 ? 'Вчера' : fmtDay(k); };
function mealByTime(){ const h = new Date().getHours(); return h < 11 ? 'breakfast' : h < 15 ? 'lunch' : h < 18 ? 'snack' : 'dinner'; }

function entryFromProduct(pid, meal, portions){
  const p = prod(pid), k = portions || 1, v = x => r1((x || 0)*k);
  if (!p) return null;
  return { id:uid(), meal, pid:p.id, name:p.name, amount: k === 1 ? '1 порция' : fmtN(k) + ' порц.',
    kcal:Math.round((p.kcal || 0)*k), p:v(p.p), f:v(p.f), c:v(p.c), nokcal: p.kcal == null };
}
/* при отметке в программе в дневник попадает то, что даёт заметные калории */
const countsKcal = p => !!p && p.kind !== 'other' && (p.kcal || 0) >= 10;
function entryFromFood(food, meal, g){
  const k = g/100;
  return { id:uid(), meal, name:food.name, amount:fmtN(g,0) + ' г',
    kcal:Math.round(food.kcal*k), p:r1(food.p*k), f:r1(food.f*k), c:r1(food.c*k) };
}

/* ---------- расчёты ---------- */
function sortedWeights(){ return S.weights.slice().sort((a,b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0); }
function currentWeight(){ const w = sortedWeights(); return w.length ? w[w.length-1].kg : (S.profile.startWeight || 70); }
function goals(){
  const pr = S.profile, w = currentWeight();
  const bmr = 10*w + 6.25*pr.height - 5*pr.age + (pr.sex === 'm' ? 5 : -161);
  const k = { lose:0.85, keep:1, gain:1.1 }[pr.goal] || 1;
  const kcal = Math.max(1200, Math.round(bmr*pr.activity*k/10)*10);
  const p = Math.round(w*1.4), f = Math.round(kcal*0.3/9);
  const c = Math.max(0, Math.round((kcal - p*4 - f*9)/4));
  const water = Math.round(w*30/50)*50;
  return { kcal, p, f, c, water };
}
function totals(k){
  return (S.meals[k] || []).reduce((a,e) => ({ kcal:a.kcal+e.kcal, p:a.p+e.p, f:a.f+e.f, c:a.c+e.c }), { kcal:0, p:0, f:0, c:0 });
}
function upsertWeight(d, kg, waist, hips){
  S.weights = S.weights.filter(w => w.d !== d);
  S.weights.push({ d, kg, waist:waist || null, hips:hips || null });
}

function demoBanner(){
  return S.demo ? `<div class="demo"><div><b>Это демо с примерами.</b> Записи условные, всё можно нажимать и менять.</div>
    <button class="btn sm line" data-act="clear-demo">Начать с чистого листа</button></div>` : '';

function macroBar(label, v, goal){
  const pct = goal ? Math.min(100, v/goal*100) : 0;
  return `<div class="mb"><div class="mb-top"><span>${label}</span><span class="tnum">${fmtN(v,0)} / ${fmtN(goal,0)} г</span></div>
    <div class="mb-track"><i style="width:${pct.toFixed(1)}%"></i></div></div>`;
}
function tileHTML(p, big){ return `<div class="tile ${{ supplement:'sup', other:'oth' }[p.kind] || ''} ${big ? 'big' : ''}" aria-hidden="true">${esc(p.abbr)}</div>`; }
function prodFilter(list, q, cat){
  const s = (q || '').trim().toLowerCase();
  return list.filter(p => (!cat || p.cats.includes(cat)) && (!s || p.name.toLowerCase().includes(s) || (p.brand || '').toLowerCase().includes(s)));
}
function kcalLabel(p){ return p.kcal != null ? fmtN(p.kcal,0) + ' ккал ' + p.basis : p.kind === 'supplement' ? 'БАД' : p.kind === 'other' ? '' : 'калорийность не указана'; }
function catChips(act, cur){
  return `<div class="chips scroll">${[['','Все'], ...CATS.map(c => [c,c])].map(([v,l]) => `<button class="chip ${v === (cur || '') ? 'on' : ''}" data-act="${act}" data-c="${esc(v)}">${l}</button>`).join('')}</div>`;
}
function fmtTime(ts){
  const d = new Date(ts), k = dkey(d);
  return relDay(k).replace('Сегодня','сегодня').replace('Вчера','вчера') + ', ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function programCard(t){
  if (!S.program) return `<div class="card"><div><div class="eyebrow">Программа</div><h2>Программа не выбрана</h2></div>
    <p class="muted small">Выберите схему приёма продуктов, и здесь появится список на каждый день.</p>
    <button class="btn ghost" data-act="tab" data-v="products">Выбрать программу</button></div>`;
  const pr = progById(S.program.id), day = daysBetween(S.program.start, t) + 1;
  if (day > pr.days) return `<div class="card"><div><div class="eyebrow">Программа</div><h2>«${esc(pr.name)}» завершена</h2></div>
    <p class="muted small">Все ${pr.days} дней пройдены. Посмотрите прогресс и обсудите следующий шаг с консультантом.</p>
    <div class="row wrap"><button class="btn" data-act="start-program" data-id="${pr.id}">Пройти ещё раз</button><button class="btn line" data-act="tab" data-v="progress">Мой прогресс</button></div></div>`;
  const items = pr.plan.filter(i => !i.to || day <= i.to);
  const ch = S.checks[t] || {}, done = items.filter(i => ch[i.id]).length;
  return `<div class="card">
    <div class="row between"><div><div class="eyebrow">Программа · день ${day} из ${pr.days}</div><h2>${esc(pr.name)}</h2></div><span class="pill tnum">${done}/${items.length}</span></div>
    <div class="progbar"><i style="width:${(day/pr.days*100).toFixed(1)}%"></i></div>
    <div class="checks">${items.map(i => `<button class="check ${ch[i.id] ? 'on' : ''}" role="checkbox" aria-checked="${!!ch[i.id]}" data-act="check" data-id="${i.id}">
      <span class="box"></span><span class="txt"><span class="when">${esc(i.when)}</span>${esc(i.text)}</span></button>`).join('')}</div>
  </div>`;
}

function weightChart(all, target){
  let pts = all;
  if (range === '30'){ const from = dkey(addDays(new Date(), -30)); pts = all.filter(w => w.d >= from); }
  if (pts.length < 2) return `<p class="muted small">Добавьте хотя бы два замера веса, и здесь появится график.</p>`;
  const W = 340, H = 190, L = 34, R = 40, T = 14, B = 24;
  const t0 = parseKey(pts[0].d).getTime(), t1 = parseKey(pts[pts.length-1].d).getTime();
  let lo = Math.min(...pts.map(p => p.kg)), hi = Math.max(...pts.map(p => p.kg));
  const showT = target && target >= lo - 3 && target <= hi + 3;
  if (showT){ lo = Math.min(lo, target); hi = Math.max(hi, target); }
  const span = Math.max(hi - lo, 1), step = span <= 2 ? 0.5 : span <= 6 ? 1 : span <= 12 ? 2 : 5;
  lo = Math.floor((lo - step*0.3)/step)*step; hi = Math.ceil((hi + step*0.3)/step)*step;
  const x = t => L + (t1 === t0 ? 0.5 : (t - t0)/(t1 - t0))*(W - L - R);
  const y = v => T + (hi - v)/(hi - lo)*(H - T - B);
  let grid = '';
  for (let v = lo; v <= hi + 1e-9; v += step){
    grid += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="lbl" x="${L - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${fmtN(v)}</text>`;
  }
  const xy = pts.map(p => [x(parseKey(p.d).getTime()), y(p.kg)]);
  const line = xy.map((q,i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
  const area = line + ` L${xy[xy.length-1][0].toFixed(1)} ${H - B} L${xy[0][0].toFixed(1)} ${H - B} Z`;
  const last = xy[xy.length-1], lastKg = pts[pts.length-1].kg;
  const tl = showT ? `<line class="tg" x1="${L}" x2="${W - R}" y1="${y(target).toFixed(1)}" y2="${y(target).toFixed(1)}"/><text class="tgl" x="${W - R + 4}" y="${(y(target) + 4).toFixed(1)}">цель</text>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Вес с ${fmtShort(pts[0].d)} по ${fmtShort(pts[pts.length-1].d)}: от ${fmtN(pts[0].kg)} до ${fmtN(lastKg)} кг">
    ${grid}${tl}
    <path class="ar" d="${area}"/><path class="ln" d="${line}"/>
    ${xy.slice(0,-1).map(q => `<circle class="dot" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="2.6"/>`).join('')}
    <circle class="end" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="5"/>
    <text class="endl" x="${(last[0] + 8).toFixed(1)}" y="${(last[1] + 4).toFixed(1)}">${fmtN(lastKg)}</text>
    <text class="lbl" x="${L}" y="${H - 6}">${fmtShort(pts[0].d)}</text>
    <text class="lbl" x="${W - R}" y="${H - 6}" text-anchor="end">${fmtShort(pts[pts.length-1].d)}</text>
  </svg>${!showT && target ? `<p class="small muted">Цель: ${fmtN(target)} кг</p>` : ''}`;
}

/* --- Bluetooth-пульсометр (стандартный профиль Heart Rate) --- */
const bt = { status:'idle', bpm:null, dev:null, msg:'' };
const heartSVG = beat => `<svg class="heart ${beat ? 'beat' : ''}" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.5-4.6-9.5-9.3C1.1 8.3 3.3 4.5 7 4.5c2 0 3.5 1.1 5 2.9 1.5-1.8 3-2.9 5-2.9 3.7 0 5.9 3.8 4.5 7.2C19.5 16.4 12 21 12 21z"/></svg>`;
function btHTML(){
  const head = `<div><h2>Пульсометр по Bluetooth</h2></div>`;
  if (bt.status === 'live') return `${head}
    <div class="bt-live">${heartSVG(true)}<div><b class="num bt-bpm">${bt.bpm ?? '…'}</b> <span class="muted">уд/мин</span><div class="small muted">${esc(bt.dev && bt.dev.name || 'Датчик')} подключён</div></div></div>
    <div class="grid2"><button class="btn" data-act="bt-save" ${bt.bpm ? '' : 'disabled'}>Сохранить замер</button><button class="btn line" data-act="bt-off">Отключить</button></div>`;
  if (bt.status === 'connecting') return `${head}<p class="small muted">Выберите устройство в списке и дождитесь подключения…</p>`;
  const note = bt.status === 'unsupported'
    ? `<p class="small bad">Этот браузер не поддерживает Bluetooth. На Android откройте приложение в Chrome.</p>`
    : bt.status === 'error' ? `<p class="small bad">${esc(bt.msg)}</p>` : '';
  return `${head}
    <p class="small muted">Подходят нагрудные датчики пульса и часы с функцией «трансляция пульса» (она есть у многих Garmin, Amazfit, Xiaomi, Polar). Работает в Chrome на Android.</p>
    ${note}
    <button class="btn ghost" data-act="bt-connect">Подключить датчик</button>`;
}
function renderBT(){ const el = $('bt-box'); if (el) el.innerHTML = btHTML(); }
async function btConnect(){
  if (!navigator.bluetooth){ bt.status = 'unsupported'; renderBT(); return; }
  try {
    bt.status = 'connecting'; renderBT();
    const dev = await navigator.bluetooth.requestDevice({ filters:[{ services:['heart_rate'] }] });
    bt.dev = dev;
    dev.addEventListener('gattserverdisconnected', () => { bt.status = 'idle'; bt.bpm = null; renderBT(); });
    const server = await dev.gatt.connect();
    const svc = await server.getPrimaryService('heart_rate');
    const ch = await svc.getCharacteristic('heart_rate_measurement');
    ch.addEventListener('characteristicvaluechanged', e => {
      const v = e.target.value, flags = v.getUint8(0);
      bt.bpm = (flags & 1) ? v.getUint16(1, true) : v.getUint8(1);
      const el = document.querySelector('.bt-bpm'); if (el) el.textContent = bt.bpm; else renderBT();
      const sb = document.querySelector('[data-act="bt-save"]'); if (sb) sb.disabled = false;
    });
    await ch.startNotifications();
    bt.status = 'live'; renderBT();
  } catch(err){
    if (err && err.name === 'NotFoundError'){ bt.status = 'idle'; }
    else { bt.status = 'error'; bt.msg = (err && err.name === 'SecurityError')
      ? 'Браузер не дал доступ к Bluetooth. Установите приложение на телефон и откройте его в Chrome.'
      : 'Не удалось подключиться. Проверьте, что на часах включена трансляция пульса, и попробуйте ещё раз.'; }
    renderBT();
  }
}

    <div><span>Калории</span><b class="num">${fmtN(g.kcal,0)}</b><span>ккал в день</span></div>
    <div><span>Белки</span><b class="num">${g.p}</b><span>г в день</span></div>
    <div><span>Вода</span><b class="num">${fmtN(g.water/1000,1)}</b><span>л в день</span></div></div>`;
}
function renderProfile(){
  const p = S.profile, standalone = window.matchMedia && matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const opt = (list, v) => list.map(([val,l]) => `<option value="${val}" ${String(val) === String(v) ? 'selected' : ''}>${l}</option>`).join('');
  $('v-profile').innerHTML = `
    <header class="vh"><div><div class="eyebrow">Профиль</div><h1>Мои цели</h1></div></header>
    <div class="card" id="pf">
      <label>Имя<input id="pf-name" maxlength="30" value="${esc(p.name)}" placeholder="Как к вам обращаться"></label>
      <div class="fgrid">
        <label>Пол<select id="pf-sex">${opt([['f','Женский'],['m','Мужской']], p.sex)}</select></label>
        <label>Возраст<input id="pf-age" type="number" inputmode="numeric" min="14" max="99" value="${p.age}"></label>
        <label>Рост, см<input id="pf-height" type="number" inputmode="numeric" min="120" max="230" value="${p.height}"></label>
        <label>Вес сейчас, кг<input id="pf-weight" type="number" inputmode="decimal" step="0.1" min="25" max="300" value="${currentWeight()}"></label>
      </div>
      <label>Активность<select id="pf-activity">${opt(ACTIVITY, p.activity)}</select></label>
      <div class="fgrid">
        <label>Цель<select id="pf-goal">${opt(GOALS, p.goal)}</select></label>
        <label>Желаемый вес, кг<input id="pf-target" type="number" inputmode="decimal" step="0.5" min="30" max="250" value="${p.target ?? ''}" placeholder="например, 65"></label>
      </div>
      <div><div class="eyebrow" style="margin-bottom:6px">Ваша норма</div><div id="pf-out">${normHTML()}</div></div>
      <p class="fine">Расчёт по формуле Миффлина — Сан Жеора с учётом активности и цели. Это ориентир, а не медицинская рекомендация.</p>
    </div>

    <div class="card">
      <h2>Установить на телефон</h2>
      ${standalone ? `<p class="small good">Приложение уже установлено на этот телефон.</p>` : ''}
      <button class="btn" data-act="install" ${installEvt ? '' : 'hidden'}>Установить приложение</button>
      <div class="how">
        <div><b>iPhone</b><ol><li>Откройте ссылку в Safari</li><li>Нажмите «Поделиться» (квадрат со стрелкой)</li><li>Выберите «На экран „Домой“»</li></ol></div>
        <div><b>Android</b><ol><li>Откройте ссылку в Chrome</li><li>Меню ⋮ → «Установить приложение» или «Добавить на главный экран»</li></ol></div>
      </div>
    </div>

    <div class="card">
      <h2>Мои данные</h2>
      <p class="small muted">Все записи хранятся только на этом телефоне. Никто, кроме вас, их не видит.</p>
      ${resetAsk
        ? `<p class="small bad">Удалить все записи о весе, питании и здоровье? Вернуть их будет нельзя.</p>
           <div class="grid2"><button class="btn danger" data-act="reset-yes">Удалить</button><button class="btn line" data-act="reset-no">Отмена</button></div>`
        : `<button class="btn line" data-act="reset">Удалить все мои записи</button>`}
    </div>
    <div class="card">
      <h2>О приложении</h2>
      <p class="small">Автор: <b>${esc(AUTHOR)}</b></p>
      <p class="small muted">«Тонус» — бесплатный дневник питания, веса и здоровья. Не является официальным приложением NL International. Покупка продукции — только в официальных магазинах NL.</p>
    </div>
    <p class="fine">Продукция не является лекарственным средством.</p>`;
}
function onProfileInput(el){
  const p = S.profile, v = el.value;
  switch (el.id){
    case 'pf-name': p.name = v.trim(); break;
    case 'pf-sex': p.sex = v; break;
    case 'pf-age': if (+v >= 14 && +v <= 99) p.age = +v; break;
    case 'pf-height': if (+v >= 120 && +v <= 230) p.height = +v; break;
    case 'pf-activity': p.activity = +v; break;
    case 'pf-goal': p.goal = v; break;
    case 'pf-target': p.target = +v >= 30 && +v <= 250 ? +v : null; break;
    case 'pf-weight': {
      const kg = r1(+String(v).replace(',', '.'));
      if (kg >= 25 && kg <= 300){ const t = todayKey(), ex = S.weights.find(w => w.d === t); upsertWeight(t, kg, ex && ex.waist, ex && ex.hips); }
      break; }
    default: return;
  }
  save();
  const out = $('pf-out'); if (out) out.innerHTML = normHTML();
}

/* ================= навигация, окно, уведомления ================= */
let view = 'today';
const RENDER = { today:renderToday, food:renderFood, progress:renderProgress, products:renderProducts, profile:renderProfile };
function show(v, to){
  view = VIEWS.includes(v) ? v : 'today';
  VIEWS.forEach(id => { $('v-' + id).hidden = id !== view; });
  document.querySelectorAll('.tab').forEach(b => b.dataset.v === view ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current'));
  RENDER[view]();
  try { history.replaceState(null, '', '#' + view); } catch(e){}
  if (to){ requestAnimationFrame(() => { const el = $(to); if (el) el.scrollIntoView({ block:'start', behavior:'smooth' }); }); }
  else window.scrollTo(0, 0);
}
function commit(){ save(); RENDER[view](); }

function openSheet(){ $('sheet').hidden = false; document.body.style.overflow = 'hidden'; const b = $('sheet-body').querySelector('button'); if (b) b.focus({ preventScroll:true }); }
function closeSheet(){ $('sheet').hidden = true; document.body.style.overflow = ''; sh = null; }

let toastTimer = null, toastUndo = null;
function toast(msg, undo){
  const el = $('toast');
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button data-act="undo">Вернуть</button>' : ''}`;
  el.hidden = false; toastUndo = undo || null;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; toastUndo = null; }, undo ? 5000 : 2600);
}

/* ================= обработчики ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, t = todayKey(), d = b.dataset;
  switch (a){
    case 'tab': closeSheet(); show(d.v, d.to); break;
    case 'add-food': openAddFood(d.meal, d.day); break;
    case 'water-add': S.water[t] = Math.max(0, (S.water[t] || 0) + Number(d.ml)); commit(); break;
    case 'water-set': { const n = +d.n, cur = Math.floor((S.water[t] || 0)/250); S.water[t] = (n === cur ? n - 1 : n)*250; commit(); break; }
    case 'mood': S.mood[t] = S.mood[t] === +d.n ? undefined : +d.n; commit(); break;
    case 'sleep': S.sleep[t] = Math.min(14, Math.max(0, (S.sleep[t] || 0) + Number(d.d))); commit(); break;
    case 'check': {
      const pr = progById(S.program.id), it = pr.plan.find(i => i.id === d.id), day = S.checks[t] || (S.checks[t] = {});
      if (day[it.id]){
        if (typeof day[it.id] === 'string') S.meals[t] = (S.meals[t] || []).filter(x => x.id !== day[it.id]);
        delete day[it.id]; commit();
      } else {
        const p = prod(it.product);
        if (countsKcal(p)){
          const en = entryFromProduct(p.id, WHEN_TO_MEAL[it.when] || mealByTime(), 1);
          (S.meals[t] || (S.meals[t] = [])).push(en); day[it.id] = en.id; commit();
          toast(`Отмечено и добавлено в дневник: ${en.kcal} ккал`);
        } else { day[it.id] = true; commit(); }
      }
      break; }
    case 'day': { const n = addDays(parseKey(foodDay), +d.d); if (dkey(n) <= t){ foodDay = dkey(n); renderFood(); } break; }
    case 'del-entry': {
      for (const k of Object.keys(S.meals)){
        const i = S.meals[k].findIndex(x => x.id === d.id);
        if (i < 0) continue;
        const [gone] = S.meals[k].splice(i, 1);
        const ch = S.checks[k] || {}, link = Object.keys(ch).find(key => ch[key] === gone.id);
        if (link) delete ch[link];
        commit();
        toast(`Удалено: ${gone.name}`, () => { S.meals[k].splice(i, 0, gone); if (link) (S.checks[k] || (S.checks[k] = {}))[link] = gone.id; commit(); });
        break;
      }
      break; }
    case 'undo': if (toastUndo){ const f = toastUndo; toastUndo = null; $('toast').hidden = true; f(); } break;
    case 'sheet-close': closeSheet(); break;
    case 'pick-meal': sh.meal = d.m; renderSheet(); break;
    case 'sheet-tab': sh.tab = d.t; sh.pick = null; renderSheet(); break;
    case 'pick-food': sh.pick = +d.i; renderSheet(); { const g = $('g-grams'); if (g){ g.focus(); g.select(); } } break;
    case 'add-product': {
      const meal = sh && sh.kind === 'add' ? sh.meal : mealByTime(), day = sh && sh.kind === 'add' ? sh.day : t;
      const en = entryFromProduct(d.id, meal, 1); closeSheet(); if (en) addEntry(day, en); break; }
    case 'open-product': openProduct(d.id); break;
    case 'nl-cat': sh.pc = d.c; renderSheet(); break;
    case 'cat-cat': catC = d.c; renderProducts(); break;
    case 'start-program':
      S.program = { id:d.id, start:t }; S.checks[t] = {}; save(); closeSheet();
      show('today'); toast(`Программа «${progById(d.id).name}» начата`); break;
    case 'stop-program': S.program = null; commit(); toast('Программа остановлена'); break;
    case 'range': range = d.r; renderProgress(); break;
    case 'del-weight': {
      const i = S.weights.findIndex(w => w.d === d.d); if (i < 0) break;
      const [gone] = S.weights.splice(i, 1); commit();
      toast(`Удалена запись за ${fmtShort(gone.d)}`, () => { S.weights.push(gone); commit(); }); break; }
    case 'del-pulse': {
      const i = S.pulse.findIndex(x => String(x.t) === d.t); if (i < 0) break;
      const [gone] = S.pulse.splice(i, 1); commit();
      toast('Замер удалён', () => { S.pulse.splice(i, 0, gone); commit(); }); break; }
    case 'bt-connect': btConnect(); break;
    case 'bt-off': try { bt.dev && bt.dev.gatt.disconnect(); } catch(err){} bt.status = 'idle'; bt.bpm = null; renderBT(); break;
    case 'bt-save': if (bt.bpm){ S.pulse.push({ t:Date.now(), bpm:bt.bpm, src:'bt' }); save(); renderProgress(); toast(`Сохранено: ${bt.bpm} уд/мин`); } break;
    case 'clear-demo': S = blank(); save(); show('profile'); toast('Примеры удалены. Заполните свой профиль'); break;
    case 'install': if (installEvt){ installEvt.prompt(); installEvt = null; renderProfile(); } break;
    case 'reset': resetAsk = true; renderProfile(); break;
    case 'reset-no': resetAsk = false; renderProfile(); break;
    case 'reset-yes': resetAsk = false; S = blank(); save(); show('today'); toast('Все записи удалены'); break;
  }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, t = todayKey(), num = id => { const v = $(id).value.replace(',', '.'); return v === '' ? null : Number(v); };
  if (f.id === 'w-form'){
    const kg = num('w-kg'); if (!(kg >= 25 && kg <= 300)) return;
    const d = $('w-date').value || t;
    upsertWeight(d > t ? t : d, r1(kg), num('w-waist'), num('w-hips'));
    commit(); toast(`Вес ${fmtN(kg)} кг сохранён`);
  } else if (f.id === 'p-form'){
    const bpm = num('p-bpm'); if (!(bpm >= 30 && bpm <= 220)) return;
    const sys = num('p-sys'), dia = num('p-dia');
    S.pulse.push({ t:Date.now(), bpm:Math.round(bpm), sys: sys && dia ? Math.round(sys) : null, dia: sys && dia ? Math.round(dia) : null, src:'manual' });
    commit(); toast('Замер сохранён');
    requestAnimationFrame(() => { const el = $('health'); if (el) el.scrollIntoView({ block:'start' }); });
  } else if (f.id === 'g-form'){
    const g = num('g-grams'); if (!(g > 0)) return;
    const en = entryFromFood(FOODS[sh.pick], sh.meal, g), day = sh.day; closeSheet(); addEntry(day, en);
  } else if (f.id === 'own-form'){
    const name = $('own-name').value.trim(), kcal = num('own-kcal'); if (!name || kcal == null) return;
    const en = { id:uid(), meal:sh.meal, name, amount:$('own-amount').value.trim() || '1 порция',
      kcal:Math.round(kcal), p:num('own-p') || 0, f:num('own-f') || 0, c:num('own-c') || 0 };
    const day = sh.day; closeSheet(); addEntry(day, en);
  }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'food-q' && sh){ sh.q = el.value; $('food-list').innerHTML = foodListHTML(); }
  else if (el.id === 'nl-q' && sh){ sh.pq = el.value; $('nl-list').innerHTML = nlRows(); }
  else if (el.id === 'cat-q'){ catQ = el.value; const list = catalogList(); $('cat-list').innerHTML = catalogRows(list); $('cat-count').textContent = list.length + ' из ' + PRODUCTS.length; }
  else if (el.id === 'g-grams' && sh && sh.pick != null){ const g = Number(el.value) || 0; $('g-calc').textContent = Math.round(FOODS[sh.pick].kcal*g/100) + ' ккал'; }
  else if (el.closest && el.closest('#pf') && el.id !== 'pf-weight') onProfileInput(el);
});
document.addEventListener('change', e => { if (e.target.id === 'pf-weight') onProfileInput(e.target); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('sheet').hidden) closeSheet(); });

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (view === 'profile') renderProfile(); });

/* офлайн-режим: только в установленной версии на своём сайте */
if ('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]')){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

const start = location.hash.slice(1);
show(VIEWS.includes(start) ? start : 'today');
})();
</script>

</body>
