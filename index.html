<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тонус</title>
<meta name="theme-color" content="#0A7A73">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Тонус">
<meta name="author" content="Дмитрий и Екатерина Мёдовы, бизнес-партнёры NL">
<meta name="robots" content="noindex">
<!-- Приложение временно закрыто для всех. Записи людей хранятся в localStorage на их телефонах и здесь не трогаются:
     когда вернём приложение (git checkout 014d7c7 -- index.html products.js или одобренная новая версия), они появятся снова. -->
<style>
  :root{--bg:#F2F5F3;--surface:#fff;--ink:#13211C;--muted:#5A6A64;--accent:#0A7A73}
  @media (prefers-color-scheme: dark){:root{--bg:#0F1614;--surface:#18221F;--ink:#E6EEEA;--muted:#94A39D;--accent:#3DBDB2}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
    font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:24px 16px}
  main{max-width:420px;background:var(--surface);border-radius:20px;padding:28px 24px;text-align:center;display:grid;gap:12px}
  .logo{width:56px;height:56px;border-radius:16px;background:var(--accent);color:#fff;display:grid;place-items:center;margin:0 auto;font-size:26px;font-weight:600}
  h1{font-size:22px;margin:4px 0 0}
  p{margin:0;color:var(--muted)}
  .fine{font-size:13px}
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">Т</div>
  <h1>«Тонус» временно недоступен</h1>
  <p>Мы дорабатываем приложение. Скоро оно снова откроется.</p>
  <p>Ваши записи сохранены на этом телефоне и вернутся, когда приложение заработает. Не удаляйте его и не очищайте данные браузера.</p>
  <p class="fine">Дмитрий и Екатерина Мёдовы, бизнес-партнёры NL</p>
</main>
<script>
  // офлайн-режим оставляем: по нему телефоны сразу получат приложение, когда его снова откроют
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
