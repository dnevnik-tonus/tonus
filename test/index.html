<!-- Экран входа по коду. lock.py ставит его вместо приложения, а само приложение кладёт ниже в зашифрованном виде -->
<style>
:root{--bg:#F2F5F3;--surface:#fff;--ink:#13211C;--muted:#5A6A64;--line:#DCE3DF;--accent:#0A7A73;--bad:#C0392F}
@media (prefers-color-scheme:dark){:root{--bg:#0F1614;--surface:#18221F;--ink:#E6EEEA;--muted:#94A39D;--line:#2A3632;--accent:#3DBDB2;--bad:#EF7A70}}
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
#lk{max-width:360px;margin:0 auto;padding:12vh 22px 30px;text-align:center}
#lk img{width:84px;height:84px;border-radius:22px;box-shadow:0 4px 14px rgba(10,122,115,.25)}
#lk h1{font-size:28px;margin:14px 0 6px}
#lk p{margin:0 0 20px;color:var(--muted)}
#lk input{box-sizing:border-box;width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:14px;font-size:19px;font-weight:600;letter-spacing:.05em;text-align:center;outline:none}
#lk input:focus{border-color:var(--accent)}
#lk input.bad{border-color:var(--bad)}
#lk button{width:100%;margin-top:12px;border:0;background:var(--accent);color:#fff;border-radius:14px;padding:14px;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
#lk button:disabled{opacity:.6}
#lk #lk-err{color:var(--bad);font-size:14.5px;font-weight:600;margin:10px 0 0!important}
#lk .fine{font-size:13.5px;margin:18px 0 0}
</style>
</head>
<body>
<div id="lk" hidden>
  <img src="icon-192.png" alt="">
  <h1>Тонус</h1>
  <p>Дневник питания и веса.<br>Введите код, который вам дали вместе со ссылкой.</p>
  <form id="lk-form" autocomplete="off">
    <input id="lk-code" type="text" placeholder="Код входа" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Код входа">
    <p id="lk-err" role="alert" hidden></p>
    <button id="lk-go" type="submit">Войти</button>
  </form>
  <p class="fine">Код вводится один раз — телефон его запомнит.<br>Нет кода? Спросите у того, кто дал вам ссылку.</p>
</div>

<script>
(() => { // всё внутри функции: после входа приложение пишется в эту же страницу, и наши имена не должны ему мешать
  const NAME = 'tonus-test.kod';
  const D = JSON.parse(document.getElementById('locked').textContent);
  const $ = id => document.getElementById(id);
  const sub = window.crypto && crypto.subtle;
  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64 = u => btoa(String.fromCharCode(...u));
  /* как в lock.py: регистр, ё/е, латиница/кириллица («tonus26» = «ТОНУС 26»), пробелы и дефисы не важны */
  const LAT = { A:'А', B:'Б', C:'К', D:'Д', E:'Е', F:'Ф', G:'Г', H:'Х', I:'И', J:'Й', K:'К', L:'Л', M:'М', N:'Н', O:'О', P:'П', Q:'К', R:'Р', S:'С', T:'Т', U:'У', V:'В', W:'В', X:'КС', Y:'Ы', Z:'З' };
  const norm = c => c.toUpperCase().replace(/Ё/g, 'Е').replace(/[A-Z]/g, ch => LAT[ch]).replace(/[^0-9А-Я]/g, '');
  const saved = () => { try { return localStorage.getItem(NAME); } catch (e) { return null; } };
  const remember = v => { try { localStorage.setItem(NAME, v); } catch (e) {} };

  async function derive(code) {
    const base = await sub.importKey('raw', new TextEncoder().encode(norm(code)), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await sub.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(D.salt), iterations: D.iter }, base, 512));
  }
  /* ключ подошёл — текст приложения, не подошёл — null */
  async function unlock(key) {
    const iv = bytes(D.iv), ct = bytes(D.ct), msg = new Uint8Array(iv.length + ct.length);
    msg.set(iv); msg.set(ct, iv.length);
    const mk = await sub.importKey('raw', key.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
    if (!await sub.verify('HMAC', mk, bytes(D.mac), msg)) return null;
    const ek = await sub.importKey('raw', key.slice(0, 32), 'AES-CTR', false, ['decrypt']);
    return new TextDecoder().decode(await sub.decrypt({ name: 'AES-CTR', counter: iv, length: 128 }, ek, ct));
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  function ask(msg, bad) {
    $('lk').hidden = false;
    $('lk-err').textContent = msg || '';
    $('lk-err').hidden = !msg;
    $('lk-code').classList.toggle('bad', !!bad);
  }

  $('lk-form').addEventListener('submit', async e => {
    e.preventDefault();
    const code = $('lk-code').value, go = $('lk-go');
    if (norm(code).length < 4) return ask('Введите код полностью.', true);
    go.disabled = true; go.textContent = 'Проверяю…';
    try {
      const key = await derive(code), html = await unlock(key);
      if (html) { remember(b64(key)); return show(html); }
      ask('Код не подошёл. Проверьте буквы и цифры.', true);
    } catch (err) { ask('Не получилось проверить код. Попробуйте ещё раз.'); }
    go.disabled = false; go.textContent = 'Войти';
  });

  (async () => {
    if (!sub) { $('lk-form').hidden = true; return ask('Этот браузер не подходит. Откройте ссылку в Safari или Chrome.'); }
    const key = saved();
    if (!key) return ask();
    try { const html = await unlock(bytes(key)); if (html) return show(html); } catch (err) {}
    ask('Код входа сменился. Введите новый код — ваши записи сохранятся.');
  })();
})();
</script>
